apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'expo.modules.tvesleme'
version = '0.1.0'

buildscript {
  def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (expoModulesCorePlugin.exists()) {
    apply from: expoModulesCorePlugin
    applyKotlinExpoModulesCorePlugin()
  }

  repositories {
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23")
  }
}

afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
      }
    }
    repositories {
      maven {
        url = mavenLocal().url
      }
    }
  }
}

android {
  namespace 'expo.modules.tvesleme'
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.majorVersion
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.23"
  // Google kod tarayıcı (TV eşleştirme QR'ı). Kamera İZNİ İSTEMEZ: tarama arayüzünü Google
  // Play hizmetleri kendi sürecinde çizer, uygulamaya yalnız okunan metin döner; model
  // ilk kullanımda Play hizmetlerince indirilir (APK'ya ML Kit modeli GİRMEZ). expo-camera
  // bu sürüme `compileOnly` bağlıdır (gradle.properties: barcode-scanner-enabled=false);
  // burada aynı sürüm `implementation` olur ama expo-camera'nın tarayıcısı yine kapalı
  // kalır (o ayrıca demetlenmiş `barcode-scanning` sınıfını arar).
  implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
