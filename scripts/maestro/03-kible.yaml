# Magaza kareleri (Android): kible. Ayri akis: onceki akis yarida kalsa bile
# bu kare uygulama yeniden baslatilarak cekilir.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: true
# Ana ekran capasi: header'daki seri dugmesi ("Seri: N gün"; toparlanmada "Toparlanma modu: …"). Kıble Dalga 4'ten
# beri sekmedir; header'daki "Kıble yönünü bul" kisayolu kalkti.
- extendedWaitUntil:
    visible: "(Seri|Toparlanma modu|Streak|Recovery mode): .*"
    timeout: 90000
- repeat:
    while:
      visible:
        id: "kutlama-devam"
    commands:
      - tapOn:
          id: "kutlama-devam"
# Kıble kendi sekmesinde (Dalga 4).
- tapOn: "(Kıble|Qibla)"
# "Konumunuz alınıyor…" durağan metindir: waitForAnimationToEnd onu beklemez, kare yükleme
# durumunda kalıyordu (ff/om/yo 2026-10-30). Yön cümlesi gelene dek bekle; gelmezse kare yine alınır.
- extendedWaitUntil:
    notVisible: "(Konumunuz alınıyor…|Getting your location…)"
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: kareler/05-kible
