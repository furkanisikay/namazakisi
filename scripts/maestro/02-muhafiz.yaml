# Magaza kareleri (Android): muhafiz ekrani + zaman seridi + adim detayi.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: true
# Ana ekran capasi: header'daki seri dugmesi ("Seri: N gün"; toparlanmada "Toparlanma modu: …"). Kıble Dalga 4'ten
# beri sekmedir; header'daki "Kıble yönünü bul" kisayolu kalkti.
- extendedWaitUntil:
    visible: "(Seri|Toparlanma modu|Streak|Recovery mode): .*"
    timeout: 90000
- repeat:
    while:
      visible:
        id: "kutlama-devam"
    commands:
      - tapOn:
          id: "kutlama-devam"

- tapOn: "(Ayarlar|Settings)"
# Ayarlar > Hatirlatmalar > Vakit cikmadan; vakit vakit ayar "Kendim ayarlayayim" katinda.
- scrollUntilVisible:
    element:
      text: "(Hatırlatmalar|Reminders)\\..*"
    direction: DOWN
    timeout: 20000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "(Hatırlatmalar|Reminders)\\..*"
- scrollUntilVisible:
    element:
      id: "satir-vakit-cikmadan"
    direction: DOWN
    timeout: 20000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "satir-vakit-cikmadan"
- scrollUntilVisible:
    element:
      id: "kendim-ayarlayayim"
    direction: DOWN
    timeout: 20000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "kendim-ayarlayayim"

# SABAH: listenin son karti acilinca icerik ekran disinda kalir.
- tapOn:
    text: "(Sabah vakti hatırlatma ayarları|Fajr reminder settings).*"
# Seridi ORTALA: sabit mesafeli kaydirma momentumla her kosuda farkli kayiyor
# ve serit karenin disinda kalabiliyordu (iOS'ta yasandi, App Store'a gitti).
- scrollUntilVisible:
    element:
      text: ".*(ilk hatırlatma|first reminder).*"
    direction: DOWN
    centerElement: true
    timeout: 20000
- takeScreenshot: kareler/02-muhafiz-zaman-seridi

# "Sesli okuma" anahtari acilinca sheet sesli okuma editoruyle dolar (birlesik
# hatirlatma modulu: dort kanal karti yerine iki anahtar). Riza kaydi yoksa once
# onay modali cikar — onaylanir.
- tapOn:
    text: "(1\\. hatırlatma|Reminder 1).*(düzenleyin|edit).*"
- waitForAnimationToEnd:
    timeout: 3000
# Anahtar "Nasıl" ızgarasında, sheet'in ilk ekranının altında kalabilir (özellik
# akışı 04-muhafiz ile aynı kaydırma).
- scrollUntilVisible:
    element:
      id: "adim-sesli-anahtari"
    direction: DOWN
    centerElement: true
    timeout: 60000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "adim-sesli-anahtari"
- runFlow:
    when:
      visible: "(Sesli okumayı açın|Turn on read aloud)"
    commands:
      - tapOn: "(Sesli okumayı açın|Turn on read aloud)"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kareler/03-adim-detay

# Akis onizlemesi: muhafizin bugun hangi saatte nasil uyaracagini listeler.
# Sheet donanim geri tusuyla kapanir (her modal useDonanimGeriTusu kullanir).
- back
- scrollUntilVisible:
    element:
      text: "(Sabah akışını önizleyin|Preview the Fajr flow)"
    direction: DOWN
    timeout: 20000
- tapOn: "(Sabah akışını önizleyin|Preview the Fajr flow)"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kareler/06-akis-onizleme
