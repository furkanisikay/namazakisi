# Magaza kareleri (Android): ana ekran + seri.
# Etiketler RN accessibilityLabel'dir (Android'de content-desc); Maestro `text`
# secicisi onlari da eslestirir ve DUZENLI IFADE olarak TAM eslesme arar.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: false
# Ana ekran capasi: header'daki seri dugmesi ("Seri: N gün"). Kıble Dalga 4'ten
# beri sekmedir; header'daki "Kıble yönünü bul" kisayolu kalkti.
- extendedWaitUntil:
    visible: "Seri: .*"
    timeout: 90000
# Acilista kutlama/duyuru modali cikarsa kapat (tohum bunu onlemeli; guvenlik agi).
- repeat:
    while:
      visible: "Devam Et"
    commands:
      - tapOn: "Devam Et"
- takeScreenshot: kareler/01-ana-ekran

# Ilerleme sekmesi: seri gok paneli sayfanin en ustunde (Dalga 4: Rozetler +
# Istatistik + Seri tek sekme).
- tapOn: "İlerleme"
# Gok panelindeki yildizlar sirayla belirir; erken cekilen kare haritayi yarim
# gosterir (iOS'ta yasandi). Parilti animasyonu surekli oldugu icin bu adim
# zaman asimiyla biter; amac beklemek.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: kareler/04-seri
