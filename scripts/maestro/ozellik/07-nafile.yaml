# tohum: ozellik
# Nafile ayarlari: uc nafile acik, adimli (kusluk 2 adim, teheccud 2 adim).
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Hatırlatmalar|Reminders)\\..*"
- tapOn:
    text: "(Hatırlatmalar|Reminders)\\..*"
- scrollUntilVisible:
    element:
      id: "satir-nafile"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "satir-nafile"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/18-nafile
- scrollUntilVisible:
    element:
      id: "nafile-kart-teheccud"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- takeScreenshot: ozk/19-nafile-teheccud
