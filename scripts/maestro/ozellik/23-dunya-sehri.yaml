# tohum: ozellik
# Konum > elle secim > "Baska bir ulke": ulke listesi, cevrimdisi sehir aramasi ve secim
# sonrasi sayfa (telefon Istanbul saatinde → saat dilimi bilgi satiri).
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Namaz vakitleri|Prayer times)\\..*"
- tapOn:
    text: "(Namaz vakitleri|Prayer times)\\..*"
- tapOn:
    text: "(Konum|Location)\\..*"
- extendedWaitUntil:
    visible:
      id: "manuel-bolge-dunya"
    timeout: 20000
- tapOn:
    id: "manuel-bolge-dunya"
- extendedWaitUntil:
    visible: "(Şehir seçin|Choose a city)"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/55-konum-dunya
- tapOn: "(Şehir seçin|Choose a city)"
- extendedWaitUntil:
    visible: "(Ülke ya da şehir arayın|Search for a country or city)"
    timeout: 10000
# Ulke listesi 34 bin sehirlik varlik okununca gelir ("Sehir listesi aciliyor" gider).
- extendedWaitUntil:
    notVisible: "(Şehir listesi açılıyor|Opening the city list)"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/56-ulke-listesi
- tapOn: "(Ülke ya da şehir arayın|Search for a country or city)"
- inputText: "Kuala"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/57-sehir-arama
- tapOn: "Kuala Lumpur, .*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/58-konum-kuala-lumpur
