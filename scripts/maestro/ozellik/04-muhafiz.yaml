# tohum: ozellik
# Muhafiz: vakit karti (zaman seridi), adim detayi (kanal cipleri, titresim ve
# gercek alarm anahtarlari), gercek alarm riza modali. Tohumda `alarmOnayi`
# YOK — anahtara dokunmak modali acar; "Vazgeç" hicbir sey yazmaz.
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Hatırlatmalar|Reminders)\\..*"
- tapOn:
    text: "(Hatırlatmalar|Reminders)\\..*"
- scrollUntilVisible:
    element:
      id: "satir-vakit-cikmadan"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "satir-vakit-cikmadan"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/06-muhafiz
- scrollUntilVisible:
    element:
      id: "kendim-ayarlayayim"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "kendim-ayarlayayim"

# SABAH: listenin son karti (Yatsi) acilinca icerik ekran disinda kalir.
- tapOn:
    text: "(Sabah vakti hatırlatma ayarları|Fajr reminder settings).*"
- scrollUntilVisible:
    element:
      id: "zaman-seridi-cumle"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- takeScreenshot: ozk/07-muhafiz-zaman-seridi

# Adim satirinin etiketi "1. hatırlatma, <sertlik> — düzenleyin. …". Ayni satirdaki
# "… — açın veya kapatın" ANAHTARDIR; ona basmak adimi kapatir.
- scrollUntilVisible:
    element:
      id: "adim-duzenle-0"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "adim-duzenle-0"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/08-adim-detay

# Gercek alarm "Nasil" izgarasindaki karodur (eskiden "Gelişmiş" bolumundeydi).
- scrollUntilVisible:
    element:
      id: "adim-alarm-anahtari"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- takeScreenshot: ozk/09-adim-detay-anahtarlar

- tapOn:
    id: "adim-alarm-anahtari"
- extendedWaitUntil:
    visible: "(Alarmı açın|Turn on alarm)"
    timeout: 10000
- takeScreenshot: ozk/10-alarm-onay
- tapOn: "(Vazgeç|Cancel)"

# NASIL = kanal kartlari: her kanal kendi alt ayarlarini tasir. Sesli okumayi ac
# (ilk seferde riza) → kart olculu genisler; video bu anin kaydidir.
- scrollUntilVisible:
    element:
      id: "adim-sesli-anahtari"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- startRecording: ozk/adim-detay-genisleme
- tapOn:
    id: "adim-sesli-anahtari"
- extendedWaitUntil:
    visible: "(Sesli okumayı açın|Turn on read aloud)"
    timeout: 10000
- tapOn: "(Sesli okumayı açın|Turn on read aloud)"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "adim-bildirim-anahtari"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "adim-bildirim-anahtari"
- waitForAnimationToEnd:
    timeout: 3000
- stopRecording
- takeScreenshot: ozk/42-adim-detay-kanallar-acik
- tapOn:
    id: "adim-bildirim-anahtari"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/43-adim-detay-bildirim-kapali

# "Tekrarla" AÇIK: aralik secicisi + canli cumle (video: acilis). Sonra seritte tikler.
- scrollUntilVisible:
    element:
      id: "adim-tekrar-anahtari"
    direction: UP
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- startRecording: ozk/adim-detay-tekrar
- tapOn:
    id: "adim-tekrar-anahtari"
- waitForAnimationToEnd:
    timeout: 3000
- stopRecording
- takeScreenshot: ozk/44-adim-detay-tekrar-acik
- back
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "zaman-seridi-cumle"
    direction: UP
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- takeScreenshot: ozk/45-zaman-seridi-tekrar
