# tohum: ozellik
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Yardım|Help)\\..*"
- tapOn:
    text: "(Yardım|Help)\\..*"
- scrollUntilVisible:
    element:
      text: "(Neler yeni|What's new)\\..*"
    direction: DOWN
    # Ayarlar listesinin EN SONU: emulatorde her kaydirma ~35 sn suruyor (761ef5d'de
    # 120 sn'de 4 kaydirma yetmedi). 03-ayarlar ile ayni: hizli kaydirma + genis sure.
    speed: 80
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "(Neler yeni|What's new)\\..*"
# Kaydırma sürerken dokunuş bazen boşa düşer (Türkçe turda Yardım listesi çekildi):
# sayfa görünene kadar bekle, görünmezse bir kez daha dokun.
- runFlow:
    when:
      notVisible:
        id: "neler-yeni-liste"
    commands:
      - tapOn:
          text: "(Neler yeni|What's new)\\..*"
- extendedWaitUntil:
    visible:
      id: "neler-yeni-liste"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/30-neler-yeni
