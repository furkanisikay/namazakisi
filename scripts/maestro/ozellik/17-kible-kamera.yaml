# tohum: ozellik
# hazirlik: kible-kamera
# Kamerali kible: yerdeki yol + Kabe isareti. Hat oncesinde CAMERA izni verir ve
# sensorleri "dik telefon, Istanbul kiblesine bakiyor" pozuna kurar
# (scripts/kible-emulator-pozu.js). Kamera goruntusu `kamera_arka: emulated` ile gelir.
appId: com.furkanisikay.namazakisi
---
- runFlow: _acilis.yaml
- tapOn: "(Kıble|Qibla)"
- tapOn: "(Kamera modu|Camera mode)"
- extendedWaitUntil:
    visible:
      id: "kamera-yon-cumlesi"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ozk/35-kible-kamera
