# tohum: dunya
# hazirlik: dunya-kl-video
# Turkiye disinda (Kuala Lumpur) hesap ayari olmayan kullaniciya ana ekranda BIR KEZ
# acilan "bolgenizin takvimi" karti; kabulden sonra ana ekran JAKIM ile.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "bolge-takvimi-modali"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/50-bolge-takvimi
- tapOn: "JAKIM takvimine geçin"
- extendedWaitUntil:
    visible:
      id: "yontem-cipi"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/51-ana-ekran-jakim
