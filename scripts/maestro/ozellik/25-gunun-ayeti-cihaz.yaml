# tohum: ozellik
# hazirlik: gunun-ayeti-cihaz
# profil: telefon
# Günün ayeti cihaz yüzeyleri (#380, #381): ayar sayfasından widget ana ekrana eklenir
# (başlatıcının "ana ekrana ekle" penceresi), duvar kâğıdı onayla açılır, ayar kartı ve düzenleyici
# çekilir, ikindi göğü + mihrap uygulanır, ana ekrana dönülür. Kilit ekranı karesi (66) hazirlik_bitir'de adb ile çekilir.
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Günün ayeti|Verse of the day)\\..*"
- tapOn:
    text: "(Günün ayeti|Verse of the day)\\..*"
- extendedWaitUntil:
    visible:
      id: "gunun-ayeti-kart"
    timeout: 10000
- tapOn:
    text: "(Widget ve duvar kâğıdı|Widget and wallpaper)\\..*"
- extendedWaitUntil:
    visible:
      id: "gunun-ayeti-widget-ekle"
    timeout: 10000
- tapOn:
    id: "gunun-ayeti-widget-ekle"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ozk/63-gunun-ayeti-widget-ekle
# Launcher3 AddItemActivity: "Add to home screen" / "Ana ekrana ekle" (büyük harfle de çizilebilir).
# Düğmenin kimliği yok; başlatıcının çevirisi olan sağdan sola dillerde metin o dildedir
# (Launcher3'te çevirisi olmayan dil İngilizceye düşer — Kurmancî, Türkmence, Tatarca, Sindhçe; Pencapça: Launcher3
# values-pa Gurmukidir, Şahmuki emülatörde (pa-Arab-PK) betik uyuşmaz → İngilizce; Filipince values-tl; Telugu,
# Kannada ve Khmer görünmez birleştirici taşır (.?); dalga 13'te yalnız İbranice (values-iw), Gürcüce ve Litvanca
# çevrili, öteki on iki dil İngilizceye düşer; Svahili ve Amharca
# çevrili, Ge'ez ገፅ/ገጽ yazımı esnek).
- tapOn:
    text: "(?i)(add to home screen|ana ekrana ekle|افزودن به صفحه اصلی|إضافة إلى الشاشة الرئيسية|ہوم اسکرین میں شامل کریں|Əsas ekrana əlavə edin|Bosh ekranga chiqarish|Негізгі экранға қосу|Башкы экранга кошуу|Weka kwenye skrini ya kwanza|ወደ መነሻ ማያ .* አክል|添加到主屏幕|முகப்புத் திரையில் சேர்.*|ഹോം സ്.?ക്രീനിലേക്ക് .*|เพิ่มลงในหน้าจอหลัก|홈 화면에 추가|Thêm vào màn hình chính|Adicionar ao ecrã principal|Aggiungi alla schermata Home|Lägg till på startskärmen|Додати на головний екран|Adaugă pe ecranul de pornire|Dodaj na početni zaslon|Додај на почетни екран|Προσθήκη στην αρχική οθόνη|Dodaj do ekranu głównego|ホーム画面に追加|હોમ સ્ક્રીનમાં ઉમેરો|Добавяне към началния екран|Додај на почетниот екран|Idagdag sa home screen|మొదటి స్క్రీన్.?కు జోడించండి|ಹೋಮ್ ಸ್ಕ್ರೀನ್.?ಗೆ ಸೇರಿಸಿ|होम स्क्रीनवर जोडा|গৃহ স্ক্ৰীনত যোগ কৰক|होम स्क्रिनमा राख्नुहोस्|මුල් තිරය වෙත එක් කරන්න|បញ្ចូល.?ទៅក្នុង.?អេក្រង់.?ដើម|הוספה למסך הבית|მთავარ ეკრანზე დამატება|Pridėti prie pagrindinio ekrano)"
- waitForAnimationToEnd:
    timeout: 4000
# Duvar kâğıdı: anahtar → onay → "Açın"; uygulama native'de hemen yazar.
- tapOn:
    id: "gunun-ayeti-duvar-anahtar"
- tapOn:
    text: "(Açın|Turn on)"
# Ayar kartının küçük önizlemeleri (kilit + ana) = kilit ekranında şu an çizilen görünüm.
- waitForAnimationToEnd:
    timeout: 4000
- scrollUntilVisible:
    element:
      id: "duvar-duzenle"
    direction: DOWN
    timeout: 20000
    waitToSettleTimeoutMs: 1500
- takeScreenshot: ozk/64-gunun-ayeti-duvar-onizleme
# Düzenleyici: tuval + Zemin sekmesi; ardından İkindi göğü + mihrap süsü uygulanır (native çizer).
- tapOn:
    id: "duvar-duzenle"
- extendedWaitUntil:
    visible:
      id: "duvar-tuval"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: ozk/67-duvar-duzenleyici
- tapOn:
    id: "duvar-zemin-ikindi"
- tapOn:
    id: "duvar-sekme-sus"
- tapOn:
    id: "duvar-sus-mihrap"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/68-duvar-duzenleyici-mihrap
# Yazı sekmesi > "Kilit ekranındaki saat": elle ayar kipinde saat alanının kesikli çerçevesi ve tutamakları.
- tapOn:
    id: "duvar-sekme-yazi"
# Kaydırma TEPSİDEN başlamalı: scrollUntilVisible ekranın ortasından kaydırır, orası tuvaldir
# (tuval hareketi yazıyı taşır, tepsi kaymaz). Tepsi ekranın alt ~%45'idir (sekme çubuğunun üstü).
- repeat:
    times: 3
    commands:
      - swipe:
          start: "50%, 84%"
          end: "50%, 60%"
          duration: 600
- tapOn:
    id: "duvar-saat-elle"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/69-duvar-saat-alani
- tapOn:
    id: "duvar-saat-elle"
- tapOn:
    id: "duvar-uygula"
# Uygulayın native'de yazar ve ayar sayfasına döner (yazım ~yüzlerce ms; fotoğrafsız).
- extendedWaitUntil:
    visible:
      id: "duvar-duzenle"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ozk/65-gunun-ayeti-ana-ekran
