# tohum: ozellik
# Now Bar ve canli sayaclar (yalniz Android). Tohum secimi YAZMAZ: varsayilan.
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "Saat ve widget\\..*"
- tapOn:
    text: "Saat ve widget\\..*"
- scrollUntilVisible:
    element:
      text: "Canlı sayaçlar\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "Canlı sayaçlar\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/20-now-bar
- scroll
- takeScreenshot: ozk/21-now-bar-alt
