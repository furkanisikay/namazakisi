# tohum: ozellik
# Hatirlatmalar sayfasi (duzey secici + satirlar) ve ayrinti sayfalari: cuma,
# yatis, camiye gitme. Bileklik rehberi artik "Saat ve widget"te (yalniz Android).
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Hatırlatmalar|Reminders)\\..*"
- tapOn:
    text: "(Hatırlatmalar|Reminders)\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/13-bildirim-ayarlari
# Satirlar sayfanin ALTINDA (ustte varsayilan oneri karti + duzey onizlemesi, #351):
# her biri once ortalanarak kaydirilir. Sira sayfadaki sirayla AYNI (cuma, camiye
# gitme, yatis) — yalniz asagi kaydirildigi icin ustte kalan satir bulunamazdi.
- scrollUntilVisible:
    element:
      id: "satir-cuma"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "satir-cuma"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/14-cuma
- back
- scrollUntilVisible:
    element:
      id: "satir-camiye-git"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "satir-camiye-git"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/16-camiye-git
- back
- scrollUntilVisible:
    element:
      id: "satir-yatis"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "satir-yatis"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/15-yatis
- back
- back
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Saat ve widget|Watch and widgets)\\..*"
- tapOn:
    text: "(Saat ve widget|Watch and widgets)\\..*"
- scrollUntilVisible:
    element:
      text: "(Bilekliğinize yalnız namaz hatırlatmalarını gönderin|Send only prayer reminders to your band)"
    direction: DOWN
    centerElement: true
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- takeScreenshot: ozk/17-bileklik-rehberi
