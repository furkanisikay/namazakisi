# tohum: ozellik
# Bildirim Ayarlari: cuma, yatis, camide kilacagim bolumleri + bileklik karti
# (bileklik yalniz Android). Hepsi tohumda ACIK.
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- scrollUntilVisible:
    element:
      text: "Bildirimler\\..*"
    direction: DOWN
    timeout: 120000
- tapOn:
    text: "Bildirimler\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/13-bildirim-ayarlari
- scrollUntilVisible:
    element:
      text: "Cuma hatırlatması"
    direction: DOWN
    centerElement: true
    timeout: 120000
- takeScreenshot: ozk/14-cuma
- scrollUntilVisible:
    element:
      text: "YATIŞ HATIRLATMASI"
    direction: DOWN
    centerElement: true
    timeout: 120000
- takeScreenshot: ozk/15-yatis
- scrollUntilVisible:
    element:
      text: "CAMİYE GİTMEK"
    direction: DOWN
    centerElement: true
    timeout: 120000
- takeScreenshot: ozk/16-camiye-git
- scrollUntilVisible:
    element:
      text: "Bilekliğinize yalnız namaz hatırlatmalarını gönderin"
    direction: DOWN
    centerElement: true
    timeout: 120000
- takeScreenshot: ozk/17-bileklik-rehberi
