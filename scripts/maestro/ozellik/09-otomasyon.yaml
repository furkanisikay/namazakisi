# Otomasyon rehberi (yalniz Android).
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- scrollUntilVisible:
    element:
      text: "Saat ve widget\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "Saat ve widget\\..*"
- scrollUntilVisible:
    element:
      id: "saat-gelismis"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "saat-gelismis"
- scrollUntilVisible:
    element:
      text: "Otomasyonlarla kullanın\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "Otomasyonlarla kullanın\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/22-otomasyon-rehberi
- scroll
- takeScreenshot: ozk/23-otomasyon-rehberi-alt
