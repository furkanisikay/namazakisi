# tohum: ozellik
# Otomasyon rehberi (yalniz Android).
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Saat ve widget|Watch and widgets)\\..*"
- tapOn:
    text: "(Saat ve widget|Watch and widgets)\\..*"
- scrollUntilVisible:
    element:
      id: "saat-gelismis"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "saat-gelismis"
- scrollUntilVisible:
    element:
      text: "(Otomasyonlarla kullanın|Use with automations)\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "(Otomasyonlarla kullanın|Use with automations)\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/22-otomasyon-rehberi
- scroll
- takeScreenshot: ozk/23-otomasyon-rehberi-alt
