# Ortak acilis (ozellik turu): uygulamayi temiz baslatir, ana ekrani bekler,
# acilis modallarini kapatir. Alt cizgiyle baslayan dosyalar hat tarafindan
# AKIS olarak calistirilmaz; diger akislar `runFlow` ile cagirir.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: true
# Yedek: hide_error_dialogs tutmazsa sistem ANR penceresini "Wait" ile kapat
# (pencere acikken uygulama erisilebilirlik agacinda gorunmez).
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Kıble yönünü bul"
    timeout: 90000
# Yedek: hide_error_dialogs tutmazsa sistem ANR penceresini "Wait" ile kapat
# (pencere acikken uygulama erisilebilirlik agacinda gorunmez).
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- repeat:
    while:
      visible: "Devam Et"
    commands:
      - tapOn: "Devam Et"
