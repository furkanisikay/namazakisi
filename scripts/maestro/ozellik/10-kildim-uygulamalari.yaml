# tohum: ozellik
# Kildim isaretleyebilen uygulamalar (yalniz Android). Ayri akis: otomasyon
# rehberinden geri donus yarida kalirsa bu kare kaybolmasin.
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- runFlow:
    file: _liste-kaydir.yaml
    env:
      HEDEF: "(Saat ve widget|Watch and widgets)\\..*"
- tapOn:
    text: "(Saat ve widget|Watch and widgets)\\..*"
- scrollUntilVisible:
    element:
      id: "saat-gelismis"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "saat-gelismis"
- scrollUntilVisible:
    element:
      text: "(Kıldım işaretleyen uygulamalar|Apps that mark I've prayed)\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "(Kıldım işaretleyen uygulamalar|Apps that mark I've prayed)\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/24-kildim-uygulamalari
