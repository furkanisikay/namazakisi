# tohum: ozellik
# Kildim isaretleyebilen uygulamalar (yalniz Android). Ayri akis: otomasyon
# rehberinden geri donus yarida kalirsa bu kare kaybolmasin.
appId: com.furkanisikay.namazakisi
---
- runFlow: _ayarlar.yaml
- scrollUntilVisible:
    element:
      text: "Saat ve widget\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "Saat ve widget\\..*"
- scrollUntilVisible:
    element:
      id: "saat-gelismis"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: "saat-gelismis"
- scrollUntilVisible:
    element:
      text: "Kıldım işaretleyen uygulamalar\\..*"
    direction: DOWN
    timeout: 300000
    waitToSettleTimeoutMs: 1500
- tapOn:
    text: "Kıldım işaretleyen uygulamalar\\..*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ozk/24-kildim-uygulamalari
