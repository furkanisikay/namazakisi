# Magaza kareleri (Android): kaza defteri + haftalik istatistik.
# Play 8 telefon karesine izin veriyor; bu ikisi 07 ve 08.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: true
# Ana ekran capasi: header'daki seri dugmesi ("Seri: N gün"). Kıble Dalga 4'ten
# beri sekmedir; header'daki "Kıble yönünü bul" kisayolu kalkti.
- extendedWaitUntil:
    visible: "Seri: .*"
    timeout: 90000
- repeat:
    while:
      visible: "Devam Et"
    commands:
      - tapOn: "Devam Et"

- tapOn: "Kaza"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kareler/07-kaza

- tapOn: "İlerleme"
# AYLIK: haftalik gorunum icinde bulunulan haftayi gosterir ve hafta basinda
# yalnizca bugun dolu kaliyor. Kilma orani bolumu seri panelinin ALTINDA →
# once secici ortalanir (gok paneli parlamasi durulmaz: settle zaman asimi sart).
- scrollUntilVisible:
    element:
      text: "Aylık"
    direction: DOWN
    centerElement: true
    timeout: 120000
    waitToSettleTimeoutMs: 1500
- tapOn: "Aylık"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: kareler/08-istatistik
