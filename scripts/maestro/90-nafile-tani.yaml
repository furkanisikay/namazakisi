# GECICI TANI AKISI (issue #77): nafile ayar ekrani Android'de anahtar acilinca
# icerik gorunmuyor raporu. Magaza karesi DEGIL — teshisten sonra silinecek.
appId: com.furkanisikay.namazakisi
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Kıble yönünü bul"
    timeout: 90000
- repeat:
    while:
      visible: "Devam Et"
    commands:
      - tapOn: "Devam Et"

- tapOn: "Ayarlar"
- scrollUntilVisible:
    element:
      text: "Nafile namazlar.*"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Nafile namazlar.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kareler/90-nafile-acilis

- tapOn: "Kuşluk hatırlatması"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kareler/91-nafile-kusluk-acik

- tapOn: "Ana ekranda göster hatırlatması"
- scrollUntilVisible:
    element:
      text: "Teheccüd hatırlatması"
    direction: DOWN
    timeout: 20000
- tapOn: "Teheccüd hatırlatması"
- waitForAnimationToEnd:
    timeout: 3000
- scroll
- takeScreenshot: kareler/92-nafile-teheccud-acik

- back
- tapOn: "Namaz Akışı.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: kareler/93-ana-ekran-nafile
