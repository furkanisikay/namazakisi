# Surumler Fable incelemesinde dogrulandi (hepsi >= 2 hafta once yayinlanmis kararli surum).
# DIKKAT: Wear Compose 1.7.x, Compose 1.12'yi ceker → compileSdk 37 + AGP 9.1 ister
# (checkDebugAarMetadata patlar). AGP 8.13 hattinda kalmak icin 1.6.2 (Compose 1.9).
# Compose BOM bilerek YOK: Compose surumunu Wear Compose'un kendi bagimliligi belirler.
# play-services-wearable telefon tarafiyla (android/app/build.gradle) AYNI olmali.
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
wearCompose = "1.6.2"
tiles = "1.6.2"
protolayout = "1.4.2"
complications = "1.3.0"
playServicesWearable = "20.0.1"
activityCompose = "1.12.0"
concurrentFutures = "1.2.0"
coroutines = "1.10.2"
junit = "4.13.2"
orgJson = "20240303"

[libraries]
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "tiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "protolayout" }
wear-protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "protolayout" }
complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "complications" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "concurrentFutures" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
