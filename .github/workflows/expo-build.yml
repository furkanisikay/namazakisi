# ========================================================================
# EAS Build & Internal Testing — Namaz Akisi
# ========================================================================
#
# Tetikleyiciler:
#   - Manuel (workflow_dispatch): Geliştirme sırasında test build almak için
#   - Otomatik (workflow_call): android-build.yml'den master merge sonrası
#
# Varsayılan mod (manuel):
#   AAB oluştur → internal track'e gönder (APK opsiyonel, GitHub Release yok)
#
# Master merge sonrası otomatik mod:
#   android-build.yml APK + GitHub Release'i halleder
#   Bu workflow sadece AAB → internal track yapar
#
# Telefon AAB derleyicisi (aab_derleyici): otomatik = EAS dener; EAS build'i
#   olusmazsa (ucretsiz plan aylik Android kotasi) ya da hata verirse AYNI iste
#   GitHub'da Gradle `:app:bundleRelease` ile derler, EAS'teki yukleme anahtariyla
#   imzalar ve Play API ile internal'a yukler. eas = yalniz EAS, github = yalniz Gradle.
#   Telefon paketi hicbir yoldan uretilemezse is KIRMIZI biter.
#
# versionCode: Build aninda timestamp (date +%s) ile atanir
#   → Hem test hem master buildleri ayni internal track'e gider,
#     tek monoton dizi gerekir; timestamp her zaman artar.
#   → Runner'da local commit edilir (push YOK) — git kirlenmez,
#     EAS commit'li state'ten okur.
#   → versionName (0.22.0) android-build.yml semantic versioning'inde kalir.
#
# Gereksinimler (GitHub Secrets):
#   EXPO_TOKEN             — expo.dev hesap tokeni
#   GOOGLE_SERVICE_ACCOUNT — Google Play service account JSON içeriği
#
# ========================================================================

name: 📱 EAS Build & Internal Testing

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'AAB oluştur — Play Store (production profili)'
        required: false
        default: true
        type: boolean
      build_apk:
        description: 'APK oluştur — direkt indirme (preview profili)'
        required: false
        default: false
        type: boolean
      internal_a_gonder:
        description: "Internal track'e gönder (build_aab=true gerektirir)"
        required: false
        default: true
        type: boolean
      aab_derleyici:
        description: 'Telefon AAB derleyicisi — otomatik: EAS dener, kota/hata olursa GitHub (Gradle)'
        required: false
        default: 'otomatik'
        type: choice
        options: ['otomatik', 'eas', 'github']
      sadece_submit:
        description: 'Yeni build YAPMA — EAS’teki son başarılı build’i internal track’e gönder'
        required: false
        default: false
        type: boolean
      build_ios:
        description: '🍎 iOS build oluştur — App Store (production profili)'
        required: false
        default: false
        type: boolean
      testflight_a_gonder:
        description: "TestFlight'a gönder (build_ios=true gerektirir)"
        required: false
        default: false
        type: boolean
      # Saat (Wear OS) + TV paketleri AYRI is (saat_tv) — telefon build'inden
      # bagimsiz. Yalniz saat/TV gondermek icin build_aab ve internal_a_gonder'i
      # KAPATIN (yoksa telefon AAB'si de EAS'te derlenip internal'a gider).
      saat_tv:
        description: '⌚📺 Saat / TV paketini Play form faktörü kanalına yükle'
        required: false
        default: 'yok'
        type: choice
        options: ['yok', 'saat', 'tv', 'ikisi']
      saat_tv_kanal:
        description: 'Form faktörü kanalı (önek otomatik: wear: / tv:)'
        required: false
        default: 'internal'
        type: choice
        options: ['internal', 'alpha', 'beta', 'production']

  # android-build.yml tarafindan master merge sonrasi otomatik cagrilir
  workflow_call:
    inputs:
      build_aab:
        type: boolean
        default: true
      build_apk:
        type: boolean
        default: false
      internal_a_gonder:
        type: boolean
        default: true
      # otomatik: EAS dener; kota/hata (FINISHED degil ve kuyrukta da degil) ise
      # telefon AAB'sini GitHub'da Gradle ile derler (asagidaki 'GitHub yedegi').
      aab_derleyici:
        type: string
        default: 'otomatik'
      # iOS RELEASE ZINCIRINE DAHIL DEGIL (bilincli): master'a her merge bir
      # release kesiyor; her birinde iOS build'i harcamak hem kuyrugu hem
      # kotayi tuketir. iOS build'i MANUEL dispatch ile alinir.
      build_ios:
        type: boolean
        default: false
      testflight_a_gonder:
        type: boolean
        default: false
      # Release zincirine BAGLI DEGIL (varsayilan 'yok'); ileride android-build.yml
      # 'saat_tv' gecirerek saat/TV'yi telefonla birlikte gonderebilir.
      saat_tv:
        type: string
        default: 'yok'
      saat_tv_kanal:
        type: string
        default: 'internal'
    secrets:
      EXPO_TOKEN:
        required: true
      GOOGLE_SERVICE_ACCOUNT:
        required: false
      ASC_API_KEY:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_KEY_ISSUER_ID:
        required: false

concurrency:
  group: eas-build-${{ github.ref_name }}
  cancel-in-progress: false

# Least-privilege: varsayilan read-only; dispatch yapan job actions:write ekler
permissions:
  contents: read

env:
  # DIKKAT — burasi bilerek 22, diger workflow'lar (ci.yml / android-build.yml) 20.
  # eas-cli'nin engines alani hala ">=20" der ama transitif bagimliligi
  # @oclif/plugin-autocomplete 3.3.0'dan itibaren ">=22" istiyor; expo-github-action
  # eas-cli'yi "yarn add" ile kurar ve yarn engine uyusmazliginda KURULUMU REDDEDER
  # ("Found incompatible module") -> v0.25.0 release'inde AAB build'i 52 sn'de patladi.
  # Bu is sadece EAS CLI'yi calistirir (npm ci + eas build); Node 22 npm 10 ile uyumlu
  # ve package.json engines ">= 20.19.4" sartini saglar.
  NODE_VERSION: '22'

jobs:
  build:
    name: 🚀 EAS Build (${{ inputs.build_aab && 'AAB' || '' }}${{ inputs.build_aab && inputs.build_apk && '+' || '' }}${{ inputs.build_apk && 'APK' || '' }}${{ (inputs.build_aab || inputs.build_apk) && inputs.build_ios && '+' || '' }}${{ inputs.build_ios && 'iOS' || '' }})
    runs-on: ubuntu-latest
    # EAS kuyrugu 2 saati asabiliyor (v0.23.27'de 114 dk beklendi). Job'un
    # timeout'u build adiminin timeout'undan BUYUK olmali, yoksa asagidaki
    # 'continue-on-error' devreye girmeden job komple oldurulur.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write   # APK build dispatch (createWorkflowDispatch) icin gerekli

    steps:
      - name: ⏱️ Zamanlayici
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🔢 Versiyon bilgisi
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 v$VERSION | versionCode: build aninda timestamp ile atanacak"

      # ==========================================
      # Ortam Hazırlığı
      # ==========================================
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📌 npm sürümünü sabitle (deterministik lock)
        run: npm install -g npm@10.9.8

      - name: 💾 Cache node_modules
        id: cache-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          # Node surumu ANAHTARA dahil: bu is Node 22, ci.yml/android-build.yml Node 20.
          # Ortak anahtar kalsaydi Node 22'de uretilen node_modules'u Node 20 isleri
          # geri yukleyebilirdi (native/binary artifact uyusmazligi).
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: 📚 Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🚀 Setup Expo & EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 20.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔍 EXPO_TOKEN kontrolu
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "❌ EXPO_TOKEN bulunamadı!"
            exit 1
          fi
          echo "✅ EXPO_TOKEN mevcut"

      # ==========================================
      # versionCode = timestamp (build aninda, push YOK)
      # EAS commit'li git state'ten okur; bu yuzden runner'da
      # local commit ediyoruz (push etmiyoruz). Timestamp her
      # zaman artar → Play Store monoton dizi sarti saglanir.
      # ==========================================
      - name: 🔢 versionCode ata (timestamp)
        if: inputs.build_aab == true
        id: vc
        run: |
          VC=$(date +%s)
          OLD_VC=$(grep -m1 'versionCode' android/app/build.gradle | tr -dc '0-9')
          echo "📌 versionCode: $OLD_VC → $VC"

          # Bare workflow: EAS native build.gradle'i okur.
          # app.json'u da set ediyoruz — olasi prebuild senaryosuna karsi garanti.
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            a.expo.android = a.expo.android || {};
            a.expo.android.versionCode = $VC;
            fs.writeFileSync('./app.json', JSON.stringify(a, null, 2) + '\n');
          "

          # EAS commit'li state okur → push'suz local commit yeterli
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle app.json
          git commit -m "ci: ephemeral versionCode $VC [skip ci]" --no-verify

          echo "code=$VC" >> $GITHUB_OUTPUT
          echo "✅ build.gradle versionCode $VC olarak ayarlandı (sadece bu build için)"

      # ==========================================
      # AAB Build (production — Play Store)
      # ==========================================
      - name: 🤖 AAB Build (production profili)
        if: inputs.build_aab == true && inputs.sadece_submit != true && inputs.aab_derleyici != 'github'
        id: aab_build
        # JOB'U DUSURME. EAS kuyrugu uzayinca bu adim zaman asimina ugrayabilir ama
        # build EAS SUNUCULARINDA calismaya devam eder ve cogu zaman BASARIYLA BITER.
        # v0.23.27'de tam bu oldu: kuyruk 114 dk surdu, 90 dk'lik job timeout'u doldu,
        # adim 'cancelled' sayildi ve submit kosulu tutmadigi icin BITMIS bir build
        # Play'e hic gonderilemedi. Gercek durumu bir sonraki adim EAS'e sorar.
        continue-on-error: true
        timeout-minutes: 200
        run: |
          echo "📦 AAB build başlatılıyor (production, versionCode ${{ steps.vc.outputs.code }})..."
          # Cikti dosyaya da yazilir: EAS ucretsiz plan kotasi dolunca build EAS'te
          # HIC OLUSMAZ ve tek iz bu mesajdir (asagida aranir). pipefail varsayilan.
          eas build \
            --platform android \
            --profile production \
            --non-interactive 2>&1 | tee /tmp/eas-aab.log
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ==========================================
      # Gercek build durumu — EAS kaynakli (adim timeout'undan BAGIMSIZ)
      # ==========================================
      - name: 🔎 EAS build durumunu doğrula
        if: inputs.build_aab == true && inputs.sadece_submit != true && inputs.aab_derleyici != 'github'
        id: build_durum
        run: |
          echo "🔎 EAS'teki son Android build sorgulanıyor (beklenen versionCode: ${{ steps.vc.outputs.code }})..."
          eas build:list --platform android --limit 1 --json --non-interactive > /tmp/son-build.json 2>/dev/null || true

          DURUM=$(node -e "
            const fs = require('fs');
            try {
              const ham = fs.readFileSync('/tmp/son-build.json', 'utf8');
              const j = JSON.parse(ham.slice(ham.indexOf('[')));
              const b = j[0];
              // Beklenen versionCode ile eslesmiyorsa BASKA bir build'dir; submit etme.
              if (!b) { console.log('YOK'); }
              else if (String(b.appBuildVersion) !== '${{ steps.vc.outputs.code }}') { console.log('ESLESMEDI'); }
              else { console.log(b.status); }
            } catch { console.log('OKUNAMADI'); }
          ")

          # Kota: EAS ucretsiz planin aylik Android hakki bittiyse build EAS'te
          # OLUSMAZ, liste bir onceki build'i doner → eskiden yalniz "ESLESMEDI"
          # yaziyordu ve sebep gorunmuyordu (0.41.2–0.42.0 Play'e hic gitmedi).
          if [ "$DURUM" != "FINISHED" ] && grep -qi "free plan" /tmp/eas-aab.log 2>/dev/null; then
            DURUM="KOTA"
            SIFIRLANMA=$(grep -oiE "reset[^.]*" /tmp/eas-aab.log | head -1 || true)
            echo "::warning title=EAS kotası doldu::Android derleme hakkı bitti (${SIFIRLANMA:-sıfırlanma tarihi okunamadı})."
          fi

          echo "📊 Son build durumu: $DURUM"
          echo "durum=$DURUM" >> $GITHUB_OUTPUT

          if [ "$DURUM" != "FINISHED" ]; then
            echo "⚠️ EAS build tamamlanmadı ($DURUM) — EAS submit atlanacak."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ==========================================
      # AAB yolu karari: eas | github | atla
      # ==========================================
      # github: girdi 'github' ya da (otomatik ve EAS build'i hic olusmadi/bozuldu).
      # Kuyrukta/derleniyor (IN_QUEUE, IN_PROGRESS, NEW) iken GitHub'a DUSULMEZ:
      # EAS build'i sonradan biterse ayni surumun iki paketi olurdu; o durumda eski
      # davranis (atla; biten build `sadece_submit` ile gonderilir).
      - name: 🧭 AAB yolu
        if: inputs.build_aab == true && inputs.sadece_submit != true
        id: aab_yol
        run: |
          MOD="${{ inputs.aab_derleyici }}"
          DURUM="${{ steps.build_durum.outputs.durum }}"
          if [ "$MOD" = "github" ]; then
            YOL=github
          elif [ "$DURUM" = "FINISHED" ]; then
            YOL=eas
          elif [ "$MOD" = "otomatik" ]; then
            case "$DURUM" in
              IN_QUEUE|IN_PROGRESS|NEW|PENDING_CANCEL) YOL=atla ;;
              *) YOL=github ;;
            esac
          else
            YOL=atla
          fi
          echo "🧭 derleyici=$MOD · EAS durumu=${DURUM:--} → yol=$YOL"
          echo "yol=$YOL" >> "$GITHUB_OUTPUT"

      # ==========================================
      # GitHub yedegi: telefon AAB'si Gradle ile (yol=github)
      # ==========================================
      # android-build.yml APK yolunun ikizi: PREBUILD YOK (android/ git'te), Hermes +
      # JS bundle'i RN gradle eklentisi bundleRelease icinde uretir. Imza = Play
      # YUKLEME anahtari (yalniz EAS'te; saat_tv isiyle ayni betik, parmak izi
      # dogrulamali). ANDROID_KEYSTORE_BASE64 (APK anahtari) KULLANILMAZ.
      # versionCode yukaridaki `vc` adiminin degeri (build.gradle'a zaten yazildi).
      - name: ☕ Java 17 (GitHub yedeği)
        if: steps.aab_yol.outputs.yol == 'github'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Gradle (GitHub yedeği)
        if: steps.aab_yol.outputs.yol == 'github'
        uses: gradle/actions/setup-gradle@v6

      - name: 🤖 Android SDK (GitHub yedeği)
        if: steps.aab_yol.outputs.yol == 'github'
        uses: android-actions/setup-android@v4

      - name: 🔑 Yükleme anahtarı (EAS) — GitHub yedeği
        if: steps.aab_yol.outputs.yol == 'github'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/eas-yukleme-anahtari.js "$RUNNER_TEMP/yukleme.jks"

      # Yama YALNIZ bu derleme icin: yamasiz build.gradle saklanip derlemeden sonra
      # geri konur (android-build.yml deseni; release commit'ine sizmasin).
      - name: 🔧 build.gradle imza yaması (GitHub yedeği)
        if: steps.aab_yol.outputs.yol == 'github'
        run: |
          cp android/app/build.gradle "$RUNNER_TEMP/build.gradle.imzasiz"
          cat << 'EOF' > "$RUNNER_TEMP/imza-yamasi.js"
          const fs = require('fs');
          const yol = 'android/app/build.gradle';
          const once = fs.readFileSync(yol, 'utf8');
          const yukleme = `
                  yukleme {
                      if (project.hasProperty('yuklemeKeystore')) {
                          storeFile file(project.property('yuklemeKeystore'))
                          storeType project.findProperty('yuklemeKeystoreTuru') ?: 'jks'
                          storePassword project.property('yuklemeKeystoreParolasi')
                          keyAlias project.property('yuklemeAnahtarAdi')
                          keyPassword project.property('yuklemeAnahtarParolasi')
                      }
                  }`;
          let s = once.replace(/(signingConfigs\s*\{)/, '$1' + yukleme);
          s = s.replace(
            /(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?)signingConfig signingConfigs\.debug/,
            '$1signingConfig signingConfigs.yukleme'
          );
          if (s === once || !s.includes('signingConfig signingConfigs.yukleme') || !s.includes('yukleme {')) {
            console.error('build.gradle yamasi uygulanamadi (signingConfigs / buildTypes.release bulunamadi)');
            process.exit(1);
          }
          fs.writeFileSync(yol, s);
          console.log('✅ release = yukleme imzasi (yalniz bu derleme)');
          EOF
          node "$RUNNER_TEMP/imza-yamasi.js"

      - name: ⚡ Gradle optimizasyonları (GitHub yedeği)
        if: steps.aab_yol.outputs.yol == 'github'
        run: |
          cat >> android/gradle.properties << 'EOF'

          # CI Build optimizations
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.configuration-cache=true
          org.gradle.configuration-cache.problems=warn
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2g
          EOF

      - name: 🏗️ AAB (bundleRelease) — GitHub yedeği
        if: steps.aab_yol.outputs.yol == 'github'
        id: gh_aab
        timeout-minutes: 60
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:bundleRelease

      - name: ↩️ İmza yamasını geri al
        if: always() && steps.aab_yol.outputs.yol == 'github'
        run: |
          if [ -f "$RUNNER_TEMP/build.gradle.imzasiz" ]; then
            cp "$RUNNER_TEMP/build.gradle.imzasiz" android/app/build.gradle
            echo "✅ build.gradle imza yamasından arındırıldı"
          fi

      # Imza ozellikleri okunmazsa bundleRelease debug anahtariyla imzalar; Play onu
      # ancak yuklemeden sonra reddeder. Burada erken ve acik dussun. JS bundle'i
      # (Hermes bayt kodu) da pakette olmali — yoksa uygulama acilista coker.
      - name: 🔏 İmza + paket denetimi (GitHub yedeği)
        if: steps.aab_yol.outputs.yol == 'github' && steps.gh_aab.outcome == 'success'
        id: gh_imza
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "❌ AAB üretilmedi"; ls -la android/app/build/outputs/bundle/release/ || true; exit 1; }
          IZ=$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$IZ" != "$YUKLEME_SHA256" ]; then
            echo "❌ AAB yükleme anahtarıyla imzalı değil"; exit 1
          fi
          unzip -l "$AAB" | grep -q "base/assets/index.android.bundle" || { echo "❌ JS bundle (index.android.bundle) pakette yok"; exit 1; }
          VN=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]*)".*/\1/')
          VC=$(grep -m1 'versionCode' android/app/build.gradle | tr -dc '0-9')
          echo "✅ imzalı (${IZ:0:8}…) · versionCode $VC · versionName $VN · $(du -h "$AAB" | cut -f1)"
          echo "ad=$VN" >> "$GITHUB_OUTPUT"

      - name: 🧹 Anahtarı sil
        if: always() && steps.aab_yol.outputs.yol == 'github'
        run: rm -f "$RUNNER_TEMP/yukleme.jks"

      - name: 📦 AAB'yi sakla (GitHub yedeği)
        if: steps.gh_imza.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: telefon-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # ==========================================
      # iOS buildNumber = timestamp (versionCode'un ikizi)
      # ==========================================
      #
      # App Store Connect AYNI buildNumber ile IKINCI yuklemeyi REDDEDER
      # ("The bundle version must be higher than the previously uploaded
      # version"). app.json'da `ios.buildNumber` TANIMLI DEGIL ve iOS-only
      # dispatch'te `versionCode ata` adimi calismaz → deger sabit kalir ve ilk
      # yuklemeden sonraki her gonderim patlardi. Android'deki timestamp
      # deseninin birebir ikizi: runner'da local commit, push YOK.
      - name: 🔢 iOS buildNumber ata (timestamp)
        if: inputs.build_ios == true && inputs.sadece_submit != true
        id: ios_bn
        run: |
          BN=$(date +%s)
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            a.expo.ios = a.expo.ios || {};
            a.expo.ios.buildNumber = '$BN';
            fs.writeFileSync('./app.json', JSON.stringify(a, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json
          # AAB adimi da app.json'a dokunmus olabilir; degisiklik yoksa
          # commit hata vermemeli.
          git diff --cached --quiet || git commit -m "ci: ephemeral iOS buildNumber $BN [skip ci]" --no-verify

          echo "numara=$BN" >> $GITHUB_OUTPUT
          echo "✅ iOS buildNumber $BN olarak ayarlandı (sadece bu build için)"

      # ==========================================
      # iOS Build (production — App Store / TestFlight)
      # ==========================================
      #
      # AAB adimiyla AYNI DESEN: job'u DUSURME, gercek durumu EAS'e sor.
      # Gerekce AGENTS.md'de kayitli (v0.23.27 dersi): EAS kuyrugu uzayinca adim
      # zaman asimina ugrar ama build EAS SUNUCULARINDA BITER; adimin outcome'una
      # guvenen submit kosulu tutmaz ve BITMIS bir build magazaya hic gitmez.
      - name: 🍎 iOS Build (production profili)
        if: inputs.build_ios == true && inputs.sadece_submit != true
        id: ios_build
        continue-on-error: true
        timeout-minutes: 200
        run: |
          echo "🍎 iOS build başlatılıyor (production)..."
          eas build             --platform ios             --profile production             --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔎 iOS build durumunu doğrula
        if: inputs.build_ios == true && inputs.sadece_submit != true
        id: ios_durum
        run: |
          echo "🔎 EAS'teki son iOS build sorgulanıyor..."
          eas build:list --platform ios --limit 1 --json --non-interactive > /tmp/son-ios.json 2>/dev/null || true

          DURUM=$(node -e "
            const fs = require('fs');
            try {
              const ham = fs.readFileSync('/tmp/son-ios.json', 'utf8');
              const j = JSON.parse(ham.slice(ham.indexOf('[')));
              const b = j[0];
              if (!b) { console.log('YOK'); }
              // BU kosuda baslatilan build mi? AAB tarafindaki versionCode
              // eslemesinin ikizi: 'eas build' build'i EAS'te OLUSTURMADAN
              // hata verirse (kimlik/kota/ag) continue-on-error adimi yesile
              // cevirir ve liste bir ONCEKI, gunler once bitmis build'i doner
              // → esleme olmadan TestFlight'a BAYAT surum gonderilirdi.
              else if (String(b.appBuildVersion) !== '${{ steps.ios_bn.outputs.numara }}') {
                console.log('ESLESMEDI');
              }
              else { console.log(b.status); }
            } catch { console.log('OKUNAMADI'); }
          ")

          echo "📊 iOS build durumu: $DURUM"
          echo "durum=$DURUM" >> $GITHUB_OUTPUT

          if [ "$DURUM" != "FINISHED" ]; then
            echo "⚠️ iOS build tamamlanmadı ($DURUM) — TestFlight gönderimi atlanacak."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ==========================================
      # TestFlight gonderimi
      # ==========================================
      - name: 🔑 App Store Connect API anahtarı hazırla
        if: |
          inputs.build_ios == true &&
          inputs.testflight_a_gonder == true &&
          steps.ios_durum.outputs.durum == 'FINISHED'
        id: asc
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          # API ANAHTARI, parola/2FA DEGIL: Apple ID parolasi CI'da kullanilamaz
          # (2FA'yi otomatiklestirilemez). .p8 anahtari App Store Connect'ten
          # BIR KEZ indirilir; kaybolursa yenisi uretilir.
          if [ -z "$ASC_API_KEY" ]; then
            echo "⚠️ ASC_API_KEY secret bulunamadı — TestFlight gönderimi atlanacak."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            printf '%s' "$ASC_API_KEY" > /tmp/asc-api-key.p8
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ App Store Connect API anahtarı mevcut"
          fi

      - name: 🚀 TestFlight'e Gönder
        if: |
          inputs.build_ios == true &&
          inputs.testflight_a_gonder == true &&
          steps.ios_durum.outputs.durum == 'FINISHED' &&
          steps.asc.outputs.available == 'true'
        run: |
          echo "📤 TestFlight'e gönderiliyor..."
          eas submit             --platform ios             --profile testflight             --latest             --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}

      # ==========================================
      # APK Build — Gradle (android-build.yml)
      # ==========================================
      - name: 📱 APK Build Tetikle (Gradle)
        if: inputs.build_apk == true
        id: apk_build
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-build.yml',
              ref: context.ref,
              inputs: { build_type: 'debug' },
            });
            console.log('✅ Gradle debug APK build kuyruğa alındı');

      # ==========================================
      # Play Store Internal Track Submit
      # ==========================================
      - name: 🔑 Google Service Account hazırla
        if: |
          inputs.internal_a_gonder == true &&
          (inputs.sadece_submit == true ||
           (inputs.build_aab == true &&
            (steps.aab_yol.outputs.yol == 'eas' || steps.gh_imza.outcome == 'success')))
        id: gsa
        env:
          GSA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GSA" ]; then
            echo "⚠️ GOOGLE_SERVICE_ACCOUNT secret bulunamadı!"
            echo "💡 GitHub Secrets > GOOGLE_SERVICE_ACCOUNT ekleyin."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            printf '%s' "$GSA" > /tmp/google-service-account.json
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Google Service Account mevcut"
          fi

      - name: 🚀 Internal Track'e Gönder (EAS)
        id: eas_submit
        if: |
          inputs.internal_a_gonder == true &&
          steps.gsa.outputs.available == 'true' &&
          (inputs.sadece_submit == true ||
           (inputs.build_aab == true && steps.aab_yol.outputs.yol == 'eas'))
        run: |
          echo "📤 Play Store internal track'e gönderiliyor..."
          eas submit \
            --platform android \
            --profile internal \
            --latest \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # GitHub yedeginin paketi: Play Developer API ile dogrudan internal'a. Surum adi
      # = versionName ("0.42.0") — EAS submit'in Play'de biraktigi adla AYNI bicim;
      # `uretime-al` (internal'da ad.includes(surum)) ve `tv-ekle` ("+TV" izi) buna dayanir.
      # Kanaldaki onceki surum (TV paketi dahil) EAS submit'teki gibi yer degistirir;
      # TV'yi `tv_telefon_kanalina` isi bu isten SONRA yeniden ekler.
      - name: 🚀 Internal Track'e Gönder (GitHub yedeği)
        id: gh_submit
        if: |
          inputs.internal_a_gonder == true &&
          steps.gsa.outputs.available == 'true' &&
          steps.gh_imza.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          node scripts/play-magaza.js aab-yukle \
            --dosya android/app/build/outputs/bundle/release/app-release.aab \
            --kanal internal \
            --ad "${{ steps.gh_imza.outputs.ad }}"

      - name: ⚠️ Submit atlandı — Secret eksik
        if: |
          inputs.build_aab == true &&
          inputs.internal_a_gonder == true &&
          steps.gsa.outputs.available == 'false'
        run: |
          echo "⚠️ Internal submit atlandı — GOOGLE_SERVICE_ACCOUNT eksik"
          echo "Build Expo dashboard'dan indirilebilir:"
          echo "https://expo.dev/accounts/furkanisikay/projects/namazakisi/builds"

      # ==========================================
      # Build Özeti
      # ==========================================
      - name: 📊 Build Özeti
        if: always()
        run: |
          END_TIME=$(date +%s)
          DURATION=$(( $(date +%s) - ${{ steps.timer.outputs.start }} ))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))

          # Adimin outcome'u DEGIL, EAS'ten okunan gercek durum (adim timeout olsa da
          # build bitmis olabilir — v0.23.27 dersi).
          EAS_D="${{ steps.build_durum.outputs.durum }}"
          YOL="${{ steps.aab_yol.outputs.yol }}"
          GH_AAB="${{ steps.gh_imza.outcome }}"
          if [ "${{ inputs.sadece_submit }}" = "true" ]; then
            AAB_DURUM="⏭️ Sadece gönder"
          elif [ "${{ inputs.build_aab }}" != "true" ]; then
            AAB_DURUM="⏭️ Seçilmedi"
          else
            case "$EAS_D" in
              FINISHED) EAS_METIN="✅ EAS" ;;
              KOTA) EAS_METIN="❌ EAS kotası doldu (ücretsiz plan aylık Android hakkı)" ;;
              "") EAS_METIN="⏭️ EAS denenmedi" ;;
              *) EAS_METIN="❌ EAS: ${EAS_D}" ;;
            esac
            if [ "$YOL" = "github" ]; then
              [ "$GH_AAB" = "success" ] && AAB_DURUM="${EAS_METIN} → ✅ GitHub (Gradle)" || AAB_DURUM="${EAS_METIN} → ❌ GitHub (Gradle) başarısız"
            elif [ "$YOL" = "atla" ]; then
              AAB_DURUM="${EAS_METIN} → ⏳ GitHub yedeği yok (EAS kuyruğunda; biterse sadece_submit)"
            else
              AAB_DURUM="${EAS_METIN}"
            fi
          fi
          APK_DURUM="${{ inputs.build_apk == true && (steps.apk_build.outcome == 'success' && '✅ Başarılı' || (steps.apk_build.outcome == 'skipped' && '⏭️ Atlandı' || '❌ Başarısız')) || '⏭️ Seçilmedi' }}"
          # iOS de AAB gibi: adimin outcome'u DEGIL, EAS'ten okunan gercek durum.
          IOS_DURUM="${{ inputs.build_ios == true && (steps.ios_durum.outputs.durum == 'FINISHED' && '✅ Başarılı' || format('❌ {0}', steps.ios_durum.outputs.durum)) || '⏭️ Seçilmedi' }}"
          if [ "${{ inputs.build_ios }}" != "true" ] || [ "${{ inputs.testflight_a_gonder }}" != "true" ]; then
            TESTFLIGHT_DURUM="⏭️ Seçilmedi"
          elif [ "${{ steps.asc.outputs.available }}" == "true" ]; then
            TESTFLIGHT_DURUM="✅ Gönderildi"
          else
            TESTFLIGHT_DURUM="⚠️ ASC_API_KEY eksik"
          fi

          # Adimlarin GERCEK sonucu (eskiden secret varligi "Gönderildi" sayiliyordu).
          if [ "${{ inputs.internal_a_gonder }}" != "true" ]; then
            SUBMIT_DURUM="⏭️ Seçilmedi"
          elif [ "${{ steps.eas_submit.outcome }}" = "success" ]; then
            SUBMIT_DURUM="✅ Gönderildi (EAS submit)"
          elif [ "${{ steps.gh_submit.outcome }}" = "success" ]; then
            SUBMIT_DURUM="✅ Gönderildi (Play API, GitHub yedeği)"
          elif [ "${{ steps.eas_submit.outcome }}" = "failure" ] || [ "${{ steps.gh_submit.outcome }}" = "failure" ]; then
            SUBMIT_DURUM="❌ Gönderim başarısız"
          elif [ "${{ steps.gsa.outputs.available }}" = "false" ]; then
            SUBMIT_DURUM="⚠️ Secret eksik"
          else
            SUBMIT_DURUM="❌ Gönderilmedi (paket yok)"
          fi

          {
            echo "## 📱 EAS Build Sonucu"
            echo ""
            echo "| Detay | Bilgi |"
            echo "|-------|-------|"
            echo "| 📦 **Versiyon** | \`${{ steps.version.outputs.version }}\` |"
            echo "| 🔢 **versionCode** | \`${{ steps.vc.outputs.code }}\` (timestamp) |"
            echo "| 🌿 **Branch** | \`${{ github.ref_name }}\` |"
            echo "| ⏱️ **Süre** | ${MINUTES}dk ${SECONDS}sn |"
            echo ""
            echo "| Build | Durum |"
            echo "|-------|-------|"
            echo "| 🤖 AAB (Play Store) | ${AAB_DURUM} |"
            echo "| 📱 APK (Gradle) | ${APK_DURUM} |"
            echo "| 🏪 Internal Submit | ${SUBMIT_DURUM} |"
            echo "| 🍎 iOS (App Store) | ${IOS_DURUM} |"
            echo "| ✈️ TestFlight | ${TESTFLIGHT_DURUM} |"
            echo ""
            echo "---"
            echo "[📱 Expo Dashboard — Builds](https://expo.dev/accounts/furkanisikay/projects/namazakisi/builds)"
          } >> $GITHUB_STEP_SUMMARY

      # ==========================================
      # Kirmizi kapi: telefon AAB'si teslim edilmediyse is DUSER
      # ==========================================
      # Eskiden EAS kotasi dolunca adim continue-on-error ile yesil kaliyor, ozet
      # yalniz "ESLESMEDI" diyordu → uc surum Play'e sessizce gitmedi. Tek istisna:
      # EAS build'i hala kuyrukta/derleniyor (yol=atla ve durum kuyruk durumu) —
      # bitince `sadece_submit` ile gonderilir; uyari yeter.
      - name: 🚦 AAB teslim kapısı
        if: always() && inputs.build_aab == true && inputs.sadece_submit != true
        run: |
          YOL="${{ steps.aab_yol.outputs.yol }}"
          DURUM="${{ steps.build_durum.outputs.durum }}"
          if [ "$YOL" = "eas" ] || [ "${{ steps.gh_imza.outcome }}" = "success" ]; then
            echo "✅ Telefon AAB'si üretildi (yol=$YOL)"
            exit 0
          fi
          if [ "$YOL" = "atla" ]; then
            case "$DURUM" in
              IN_QUEUE|IN_PROGRESS|NEW|PENDING_CANCEL)
                echo "::warning title=AAB beklemede::EAS build'i hâlâ $DURUM — bitince sadece_submit=true ile gönderin."
                exit 0 ;;
            esac
          fi
          echo "::error title=Telefon AAB'si üretilmedi::EAS durumu=${DURUM:--}, yol=${YOL:--}. Play'e telefon paketi GİTMEDİ."
          exit 1

  # ========================================================================
  # Saat (Wear OS) + Android TV → Play form faktörü kanalları
  # ========================================================================
  #
  # Ayni uygulama kaydi (com.furkanisikay.namazakisi), ayri AAB'ler:
  #   wear/ → `wear:<kanal>`, tv/ → `tv:<kanal>` (Play Developer API "form factor
  #   tracks": `<onek>:<varsayilan kanal adi>`).
  # Imza: Play App Signing tum form faktorlerinde AYNI yukleme anahtarini ister.
  #   Anahtar YALNIZ EAS'te → scripts/eas-yukleme-anahtari.js EXPO_TOKEN ile
  #   indirir, parmak izini dogrular, $RUNNER_TEMP'e yazar; is sonunda silinir.
  # versionCode: Play'de kod TUM uygulama icin tekil olmali. Telefon `date +%s`
  #   kullanir (build isinde, bu isle PARALEL). Burada TEK taban alinir ve GERIYE
  #   kaydirilir: saat = taban-600, TV = taban-599. Ileri ofset (+1/+2) ayni kosudaki
  #   telefon isinin 1-2 sn sonra okuyacagi koda denk gelebilirdi; carpismada Play
  #   saatleri dakikalar icinde kabul eder, saatler sonraki telefon `eas submit`'ini
  #   REDDEDERDI. Telefon kodu kendi isinin baslangicindan buyuktur; ayni kosuda
  #   esitlik icin bu isin kurulumu telefonunkinden 10 dk uzun surmeli. Geriye
  #   ofset saat/TV kanalinda monotonlugu bozmaz (her kosu bir oncekinden gec).
  saat_tv:
    name: ⌚📺 Saat / TV → Play (${{ inputs.saat_tv }} · ${{ inputs.saat_tv_kanal }})
    if: inputs.saat_tv != '' && inputs.saat_tv != 'yok'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # JDK 21: TV'nin adhan2/kotlinx-datetime ikilileri 21 sinif surumu (tv-build.yml);
      # AGP 8.13 + Gradle 8.14 saat icin de 21'de calisir. Bayt kodu 17 hedefli.
      - name: ☕ Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🤖 Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 Secret kontrolü
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GSA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "❌ EXPO_TOKEN yok (yükleme anahtarı EAS'ten okunur)"; exit 1; }
          [ -n "$GSA" ] || { echo "❌ GOOGLE_SERVICE_ACCOUNT yok"; exit 1; }
          echo "✅ Secret'lar mevcut"

      - name: 🔢 versionCode
        id: vc
        run: |
          TABAN=$(date +%s)
          echo "saat=$((TABAN - 600))" >> "$GITHUB_OUTPUT"
          echo "tv=$((TABAN - 599))" >> "$GITHUB_OUTPUT"
          echo "surum=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          echo "📌 saat $((TABAN - 600)) · tv $((TABAN - 599))"

      # Sirlar maskelenir, Gradle'a ORG_GRADLE_PROJECT_yukleme* ile gecer (komut
      # satirinda -P YOK). Keystore parmak izi EAS kaydiyla burada dogrulanir.
      - name: 🔑 Yükleme anahtarı (EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/eas-yukleme-anahtari.js "$RUNNER_TEMP/yukleme.jks"

      - name: ⌚ Saat AAB (bundleRelease)
        if: inputs.saat_tv == 'saat' || inputs.saat_tv == 'ikisi'
        working-directory: wear
        run: ./gradlew --no-daemon bundleRelease -PwearVersionCode=${{ steps.vc.outputs.saat }}

      - name: 📺 TV AAB (bundleRelease)
        if: inputs.saat_tv == 'tv' || inputs.saat_tv == 'ikisi'
        working-directory: tv
        run: ./gradlew --no-daemon bundleRelease -PtvVersionCode=${{ steps.vc.outputs.tv }}

      # Paket gercekten yukleme anahtariyla mi imzalandi? Imza ozellikleri okunmazsa
      # bundleRelease IMZASIZ paket uretir (yerel/PR davranisi); Play onu ancak
      # yuklemeden sonra reddeder. Burada erken ve acik dussun.
      - name: 🔏 İmza denetimi
        run: |
          set -euo pipefail
          SAYI=0
          for aab in wear/app/build/outputs/bundle/release/*.aab tv/app/build/outputs/bundle/release/*.aab; do
            [ -f "$aab" ] || continue
            IZ=$(keytool -printcert -jarfile "$aab" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
            if [ "$IZ" != "$YUKLEME_SHA256" ]; then
              echo "❌ $aab yükleme anahtarıyla imzalı değil"; exit 1
            fi
            echo "✅ $aab imzalı (${IZ:0:8}…)"
            SAYI=$((SAYI + 1))
          done
          [ "$SAYI" -gt 0 ] || { echo "❌ AAB üretilmedi"; exit 1; }

      - name: 🧹 Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/yukleme.jks"

      - name: 🚀 Saat → wear:${{ inputs.saat_tv_kanal }}
        if: inputs.saat_tv == 'saat' || inputs.saat_tv == 'ikisi'
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          node scripts/play-magaza.js aab-yukle \
            --dosya "$(ls wear/app/build/outputs/bundle/release/*.aab | head -1)" \
            --kanal "wear:${{ inputs.saat_tv_kanal }}" \
            --ad "${{ steps.vc.outputs.surum }} (saat)"

      # TV Play'de telefonla AYNI kanalda: paket burada yalnız artifact olur, telefon
      # gönderimi BİTTİKTEN sonra `tv_telefon_kanalina` işi sürüme ek paket olarak ekler.
      - name: 📦 TV AAB'sini sakla
        if: inputs.saat_tv == 'tv' || inputs.saat_tv == 'ikisi'
        uses: actions/upload-artifact@v7
        with:
          name: tv-aab
          path: tv/app/build/outputs/bundle/release/*.aab
          retention-days: 3

      - name: 📊 Özet
        if: always()
        run: |
          {
            echo "## ⌚📺 Saat / TV → Play"
            echo ""
            echo "| Hedef | versionCode | Kanal |"
            echo "|---|---|---|"
            case "${{ inputs.saat_tv }}" in saat|ikisi) echo "| ⌚ Wear OS | \`${{ steps.vc.outputs.saat }}\` | \`wear:${{ inputs.saat_tv_kanal }}\` |";; esac
            case "${{ inputs.saat_tv }}" in tv|ikisi) echo "| 📺 Android TV | \`${{ steps.vc.outputs.tv }}\` | telefonla aynı \`internal\` sürümüne eklenir (ayrı iş) |";; esac
            echo ""
            echo "Sürüm adı: \`${{ steps.vc.outputs.surum }}\` · iş sonucu: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Android TV: Play'de ayrı kanal YOK, telefonla aynı `internal` kanalında yaşar.
  # Telefon gönderimi (build işi: eas submit ya da GitHub yedeğinin aab-yukle'si) sürümü yeniden kurar; TV paketi ondan
  # SONRA o sürüme ek paket olarak eklenir — önce eklenseydi eas submit onu düşürürdü.
  tv_telefon_kanalina:
    name: 📺 TV → internal (telefon sürümüne ek)
    needs: [build, saat_tv]
    if: |
      always() && needs.saat_tv.result == 'success' &&
      (inputs.saat_tv == 'tv' || inputs.saat_tv == 'ikisi') &&
      inputs.saat_tv_kanal == 'internal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 📦 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 📥 TV AAB
        uses: actions/download-artifact@v8
        with:
          name: tv-aab
          path: tv-aab
      - name: 🚀 TV → internal
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          node scripts/play-magaza.js tv-ekle             --dosya "$(ls tv-aab/*.aab | head -1)"             --kanal internal
