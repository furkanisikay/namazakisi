# ========================================================================
# Android TV vakit panosu — derleme + birim test + lint (issue #286)
# ========================================================================
#
# `tv/` BAĞIMSIZ bir Gradle köküdür (wear/'in ikizi; android/ RN yapılandırmasına
# dahil değil). Bu iş PR kontrolüdür; release KESMEZ. `ci.yml` `tv/**`
# değişikliklerini yok sayar → TV commit'leri telefon için gereksiz EAS/Play
# release'i üretmez (AGENTS.md "araç commit'leri de release keser" dersi).
#
# Parite İKİ TARAFTA kilitli: telefonun adhan JS hesabı ile TV'nin adhan2 hesabı
# aynı fikstürü (tv/app/src/test/resources/vakit-fiksturu.json) kabul etmeli.
# Play dağıtımı: expo-build.yml > saat_tv işi (tv:<kanal>).
# ========================================================================

name: Android TV

on:
  pull_request:
    paths:
      - 'tv/**'
      - 'scripts/tv/**'
      - 'src/domain/services/NamazVaktiHesaplayiciServisi.ts'
      - 'src/domain/services/KazaHesaplayiciServisi.ts'
      - 'src/domain/services/TurkiyeKonumServisi.ts'
      - 'src/domain/services/__tests__/TvVakitParitesi.test.ts'
      - 'src/core/vakit/**'
      - 'src/core/cihazAgi/yuk.ts'
      - 'src/core/constants/UygulamaSabitleri.ts'
      - '.github/workflows/tv-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    name: 📺 TV panosu
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # JDK 21: adhan2/kotlinx-datetime JVM ikilileri Java 21 sinif surumuyla
      # yayinlanmis; JVM birim testleri JDK 17'de UnsupportedClassVersionError
      # verir (APK derlemesi etkilenmez, D8 yeni sinif surumunu okur). Uretilen
      # bayt kodu yine 17 hedefli (build.gradle.kts > jvmTarget).
      - name: ☕ Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🤖 Android SDK
        uses: android-actions/setup-android@v4

      - name: 📦 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıklar
        run: npm ci

      - name: 📜 Parite testi (JS — telefonun hesap yolu)
        run: npx jest TvVakitParitesi

      # bundleRelease: Play hattinin (expo-build.yml > saat_tv) yolunu PR'da kanitlar;
      # imza ozellikleri yokken IMZASIZ paket uretir (build.gradle.kts).
      - name: 🧪 Birim test + lint + derleme (TV)
        working-directory: tv
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease

      - name: 📤 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: namazakisi-tv-debug
          path: tv/app/build/outputs/apk/debug/*.apk
          retention-days: 14
