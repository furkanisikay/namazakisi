name: 📸 Android Ekran Görüntüleri

# Google Play icin telefon karelerini emulatorde uretir.
# iOS hattinin (ios-ekran-goruntuleri.yml) ikizi; ayni tohum verisini kullanir.
#
# Play telefon karesi en-boy orani en fazla 2:1 olabilir -> 1080x1920 (16:9)
# profili secilir; yayindaki mevcut kareler de bu boyutta.
#
# `tur` girdisi:
#   magaza  (varsayilan) — yalniz magaza kareleri (`kareler/`, artifact
#           `android-ekran-goruntuleri`); davranisi ozellik turu eklenmeden
#           oncekiyle BIREBIR ayni.
#   ozellik — yeni ekranlarin kareleri (`kareler-ozellik/<profil>-<tema>/`,
#           artifact `android-ozellik-kareleri`): telefon acik + koyu tema,
#           istenirse tablet (acik). Akislar `scripts/maestro/ozellik/`.
#   ikisi   — ikisi de, AYNI APK ile (Gradle bir kez).
#   saat    — Wear OS saat uygulamasinin kareleri (`kareler-saat/<yuvarlak|kare>/`,
#           artifact `android-saat-kareleri`); ayri is, telefon APK'si derlenmez.
#   tv      — Android TV panosunun kareleri (`kareler-tv/`, artifact
#           `android-tv-kareleri`); ayri is.
#   cihazlar — saat + tv (iki is paralel kosar).
#   tablet  — YALNIZ tablet ozellik turu (pixel_tablet, acik tema); telefon turu ve magaza
#           kareleri kosmaz. Genis ekran duzeni gelistirilirken hizli dongu icin.
#
# NOT: saat/TV icin AYRI workflow acilmadi: GitHub varsayilan dalda (master) olmayan
# bir workflow'u workflow_dispatch ile calistiramaz (404); bu dosya zaten master'da.

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API seviyesi'
        required: false
        default: '34'
      apk_run_id:
        description: 'Önceki koşunun debug APK artifact''ını kullan (boş = yeniden derle). JS Metro''dan geldiği için APK yalnız native kod değişince yenilenmeli.'
        required: false
        default: ''
      dil:
        description: 'Uygulama dili (tr = Türkçe, mağaza ve README kareleri; diğerleri = o dilin kanıt turu, artifact adlarına -<dil> eklenir)'
        type: choice
        required: false
        default: 'tr'
        options:
          - tr
          - en
          - id
          - de
          - fr
          - bs
          - ru
          - ms
          - ar
          - ur
      tur:
        description: 'Hangi kareler: magaza (Play kareleri) | ozellik (yeni ekranlar turu) | ikisi | tablet (yalnız tablet özellik turu) | katlanabilir (Pixel Fold: açık + masaüstü postürü) | saat (Wear OS) | tv (Android TV) | cihazlar (saat + tv)'
        type: choice
        required: false
        default: 'magaza'
        options:
          - magaza
          - ozellik
          - ikisi
          - tablet
          - katlanabilir
          - saat
          - tv
          - cihazlar
      ozellik_profili:
        description: 'Özellik turu telefon profili (avdmanager cihaz kimliği)'
        required: false
        default: 'pixel_6'
      tablet:
        description: 'Özellik turunu tablette de çek (pixel_tablet, açık tema; ~+60-90 dk)'
        type: boolean
        required: false
        default: false
      akis_filtresi:
        description: 'Özellik turu: yalnız adı bu bash regex''ine uyan akışları koş (boş = hepsi; ör. 16-|17-|18-)'
        required: false
        default: ''
      performans_olcumu:
        description: 'Özellik turu (telefon): animasyonlar AÇIKKEN İlerleme kaydırmasında dumpsys gfxinfo ölçümü'
        type: boolean
        required: false
        default: false
      kamera_arka:
        description: 'Özellik turu emülatör arka kamerası (emulated: kameralı kıble karesi 17-kible-kamera bunu ister; mağaza turu daima none)'
        type: choice
        required: false
        default: 'emulated'
        options:
          - emulated
          - none

permissions:
  contents: read

env:
  # Tohum betiği (`scripts/magaza-tohum-verisi.js`) uygulamanın dil kaydını, `scripts/emulator-hazir-bekle.sh`
  # emülatörün cihaz dilini buna göre yazar (`-change-locale` kullanılmaz: açılış yarışı).
  TOHUM_DIL: ${{ inputs.dil || 'tr' }}

jobs:
  kareler:
    name: 📸 Emülatörde kare çek
    # Telefon kareleri yalniz telefon turlarinda (saat/tv kendi islerinde).
    if: ${{ inputs.tur == 'magaza' || inputs.tur == 'ozellik' || inputs.tur == 'ikisi' || inputs.tur == 'tablet' || inputs.tur == 'katlanabilir' }}
    runs-on: ubuntu-latest
    # 90 dk magaza turu icin yetiyordu; ozellik turu (iki tema + istege bagli
    # tablet, her akistan once yeniden tohumlama) ayni isin icinde kosar.
    timeout-minutes: 330
    # Telefon (acik+koyu) + tablet ozellik turu ~3,5 sa suruyor (kaydirma basina ~35 sn);
    # 180 dk tabletin son akisini kesti (5817e59). GitHub is tavani 360 dk.

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 22
        uses: actions/setup-node@v7
        with:
          # node:sqlite (RKStorage tohumlamasi) Node 22+ ister.
          node-version: '22'
          cache: 'npm'

      - name: ☕ JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔓 KVM'i etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📦 Önceki APK'yı indir
        if: ${{ inputs.apk_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔨 Debug APK derle
        if: ${{ inputs.apk_run_id == '' }}
        working-directory: android
        run: |
          set -eo pipefail
          # gradlew Windows'ta commit edildigi icin exec biti YOK -> "Permission
          # denied" (android-build.yml de ayni chmod'u yapiyor).
          chmod +x gradlew
          # DEBUG bilincli: `run-as` yalnizca debuggable build'lerde calisir ve
          # AsyncStorage'i (RKStorage) tohumlamanin tek yolu o.
          ./gradlew assembleDebug --no-daemon
          find . -name '*.apk' -path '*debug*' -print

      - name: ⬆️ APK'yı sakla (sonraki koşular yeniden kullansın)
        if: ${{ inputs.apk_run_id == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 🧰 Maestro kur
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: 🚇 Metro'yu başlat
        run: |
          # Debug APK JS paketini Metro'dan alir (release'te gomulu gelir ama
          # release debuggable olmadigi icin run-as calismaz).
          npx expo start --port 8081 > /tmp/metro.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:8081/status" >/dev/null 2>&1 && break
            sleep 2
          done
          echo "Metro hazır"

      - name: 📱 Emülatörde kareleri çek
        if: ${{ inputs.tur != 'ozellik' && inputs.tur != 'tablet' && inputs.tur != 'katlanabilir' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Istanbul
          # Adimlar TEK bash betiginde: action her satiri ayri `sh` (dash) ile
          # calistirir; pipefail patlar ve degiskenler satirlar arasinda kaybolur.
          script: bash scripts/android-kare-hatti.sh

      - name: 🧾 Kare boyutları
        if: ${{ always() && inputs.tur != 'ozellik' && inputs.tur != 'tablet' && inputs.tur != 'katlanabilir' }}
        run: |
          for f in kareler/*.png; do
            node -e 'const b=require("fs").readFileSync(process.argv[1]);console.log(process.argv[1], b.readUInt32BE(16)+"x"+b.readUInt32BE(20))' "$f"
          done || true

      - name: ⬆️ Kareleri yükle
        if: ${{ always() && inputs.tur != 'ozellik' && inputs.tur != 'tablet' && inputs.tur != 'katlanabilir' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-ekran-goruntuleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          # YALNIZ kareler: disaridan bir yol (~/.maestro) eklenince ortak kok
          # degisiyor ve kareler artifact icinde alt klasore iniyordu.
          path: kareler/
          retention-days: 14
          if-no-files-found: warn

      # --- OZELLIK TURU (magaza turuna dokunmaz; ayri klasor + ayri artifact) ---
      # Magaza adimi dustuyse de kossun (`!cancelled()`): iki tur birbirinden bagimsiz.
      - name: 🧭 Özellik turu — telefon (açık + koyu)
        if: ${{ !cancelled() && inputs.tur != 'magaza' && inputs.tur != 'tablet' && inputs.tur != 'katlanabilir' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ inputs.ozellik_profili }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back ${{ inputs.kamera_arka || 'emulated' }} -timezone Europe/Istanbul
          script: bash scripts/android-ozellik-hatti.sh telefon acik koyu
        env:
          AKIS_FILTRESI: ${{ inputs.akis_filtresi }}
          PERFORMANS_OLCUMU: ${{ inputs.performans_olcumu && '1' || '' }}

      - name: 🧭 Özellik turu — tablet (açık)
        if: ${{ !cancelled() && inputs.tur != 'magaza' && (inputs.tablet || inputs.tur == 'tablet') }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AKIS_FILTRESI: ${{ inputs.akis_filtresi }}
          PERFORMANS_OLCUMU: ${{ inputs.performans_olcumu && '1' || '' }}
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back ${{ inputs.kamera_arka || 'emulated' }} -timezone Europe/Istanbul
          script: bash scripts/android-ozellik-hatti.sh tablet acik

      # Katlanabilir (Pixel Fold): iç ekran açıkken ana ekran + masaüstü postürü (yarı açık,
      # yatay menteşe). Yalnız iki akış koşar; postür `# hazirlik: masaustu` ile adb'den kurulur.
      - name: 📖 Katlanabilir (Pixel Fold)
        if: ${{ !cancelled() && inputs.tur == 'katlanabilir' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AKIS_FILTRESI: ${{ inputs.akis_filtresi || '^(01-ana-ekran|20-katlanabilir)' }}
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          # Runner'da pixel_fold profili yok: pixel_6 tabanina ic ekran + dikey mentese.
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: bash scripts/android-flip-avd.sh fold
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Istanbul
          script: bash scripts/android-ozellik-hatti.sh katlanabilir acik

      # Flip (Z Flip tipi): hazir AVD profili yok → pixel_6 tabanina kompakt ekran + yatay
      # mentese yazilir (scripts/android-flip-avd.sh). Yalniz masaustu postur karesi.
      - name: 📱 Katlanabilir (Flip, masaüstü)
        if: ${{ !cancelled() && inputs.tur == 'katlanabilir' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          AKIS_FILTRESI: '^20-katlanabilir'
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          pre-emulator-launch-script: bash scripts/android-flip-avd.sh flip
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Istanbul
          script: bash scripts/android-ozellik-hatti.sh flip acik

      - name: 🧾 Özellik kareleri özeti
        if: ${{ always() && inputs.tur != 'magaza' }}
        run: |
          node scripts/ozellik-kare-ozeti.js kareler-ozellik android | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f kareler-ozellik/performans-ozet.md ]; then cat kareler-ozellik/performans-ozet.md | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: ⬆️ Özellik karelerini yükle
        if: ${{ always() && inputs.tur != 'magaza' }}
        uses: actions/upload-artifact@v7
        with:
          name: android-ozellik-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: kareler-ozellik/
          retention-days: 14
          if-no-files-found: warn

      - name: 🪵 Maestro çıktısını yükle (hata ayıklama)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-maestro-ciktisi${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🪵 Metro günlüğü (hata ayıklama)
        if: failure()
        run: tail -60 /tmp/metro.log || true

  # --- WEAR OS SAAT (telefon isinden bagimsiz; `wear/` ayri Gradle koku) ---
  saat:
    name: ⌚ Saat kareleri (Wear OS)
    if: ${{ inputs.tur == 'saat' || inputs.tur == 'cihazlar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: ☕ JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # ~/.gradle onbellegi (wear-build.yml ile ayni eylem): bagimliliklar her kosuda inmesin.
      - name: 🐘 Gradle
        uses: gradle/actions/setup-gradle@v6

      # Tohum yuku adhan JS ile uretilir (telefonun hesap yolu); yamalar gerekmez.
      - name: 📦 Bağımlılıkları kur
        run: npm ci --ignore-scripts

      - name: 🔓 KVM'i etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🔨 Saat debug APK
        working-directory: wear
        run: |
          chmod +x gradlew
          # DEBUG bilincli: `run-as` yalniz debuggable build'de calisir (tohum yolu).
          ./gradlew --no-daemon assembleDebug
          find app/build/outputs/apk -name '*.apk' -print

      - name: ⌚ Yuvarlak saat (Wear OS 5, 454x454)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Istanbul
          script: bash scripts/saat-kare-hatti.sh yuvarlak

      # wearos_square profili 360x360'tir; Play saat karesi en az 384x384 ister →
      # ekran `-skin 384x384` ile buyutulur (yogunluk ayni, ~16 dp daha genis).
      - name: ⌚ Kare saat (Wear OS 5, 384x384)
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_square
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Istanbul -skin 384x384
          script: bash scripts/saat-kare-hatti.sh kare

      - name: 🧾 Saat kareleri özeti
        if: always()
        run: node scripts/cihaz-kare-ozeti.js kareler-saat saat | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ⬆️ Saat karelerini yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-saat-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: kareler-saat/
          retention-days: 14
          if-no-files-found: warn

      # Olayla baslayan animasyonlarin ekran kaydi (adb screenrecord, en gayret; hat
      # betigi sonda animator olcegini 1 yapip kaydeder). Kare artifact'indan AYRI.
      - name: 🎬 Saat animasyon videolarını yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-saat-videolari${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: videolar-saat/
          retention-days: 14
          if-no-files-found: warn

  # --- ANDROID TV (bagimsiz; `tv/` ayri Gradle koku) ---
  tv:
    name: 📺 TV kareleri (Android TV)
    if: ${{ inputs.tur == 'tv' || inputs.tur == 'cihazlar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: ☕ JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 🔓 KVM'i etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🔨 TV debug APK
        working-directory: tv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          find app/build/outputs/apk -name '*.apk' -print

      # Kare hatti telefonu SIFRELI istemciyle taklit eder (scripts/tv/tv-esitleme-istemci.js:
      # @noble/ciphers + adhan). Yasam dongusu betikleri gerekmez.
      - name: 📦 İstemci bağımlılıkları
        run: npm ci --ignore-scripts --no-audit --no-fund

      # android-tv imaji API 34'te yalniz x86 (x86_64 yok); uygulama saf Kotlin/JVM.
      - name: 📺 TV (1080p)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Europe/Istanbul
          script: bash scripts/tv-kare-hatti.sh

      - name: 🧾 TV kareleri özeti
        if: always()
        run: node scripts/cihaz-kare-ozeti.js kareler-tv tv | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ⬆️ TV karelerini yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: kareler-tv/
          retention-days: 14
          if-no-files-found: warn

      # Olayla baslayan animasyonlarin ekran kaydi (adb screenrecord, en gayret; hat
      # betigi sonda animator olcegini 1 yapip kaydeder). Kare artifact'indan AYRI.
      - name: 🎬 TV animasyon videolarını yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-videolari${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: videolar-tv/
          retention-days: 14
          if-no-files-found: warn
