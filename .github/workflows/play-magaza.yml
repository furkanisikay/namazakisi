name: 🏪 Play Mağaza Kaydı

# Google Play magaza kaydini okur veya gunceller.
# Metinlerin tek dogru kaynagi docs/app-store/magaza-metinleri.md.
#
# `oku` varsayilandir ve HICBIR SEY DEGISTIRMEZ (edit acilir, okunur, silinir).
# `yaz` modu edit'i commit eder: degisiklik magazada yayina girer.
#
# Gorseller: `kare_run_id` verilirse o android-ekran-goruntuleri kosusunun ham
# kareleri indirilir, mockup'lar + one cikan gorsel BURADA uretilir ve artifact
# olarak birakilir. `oku` + `kare_run_id` = yalniz onizleme (yukleme yok).

on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Ne yapılsın?'
        type: choice
        options:
          - oku
          - yaz
        default: oku
      kare_run_id:
        description: 'Görseller için android-ekran-goruntuleri çalışma kimliği (boş = yalnız metin)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  magaza:
    name: 🏪 Play kaydı
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: ⚙️ Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🖼️ Android karelerini indir
        if: ${{ inputs.kare_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: android-ekran-goruntuleri
          path: kareler
          run-id: ${{ inputs.kare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎨 Mockup ve öne çıkan görsel üret
        if: ${{ inputs.kare_run_id != '' }}
        run: |
          set -eo pipefail
          ls kareler/*.png
          node scripts/magaza-mockup.js kareler mockup --platform android --one-cikan
          ls -la mockup

      - name: ⬆️ Mockup'ları yükle (önizleme)
        if: ${{ inputs.kare_run_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: play-mockuplari
          path: mockup/
          retention-days: 14

      - name: 🏪 Play kaydını ${{ inputs.mod }}
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -eo pipefail
          if [ "${{ inputs.mod }}" = "yaz" ] && [ -n "${{ inputs.kare_run_id }}" ]; then
            node scripts/play-magaza.js yaz --gorseller mockup
          else
            node scripts/play-magaza.js "${{ inputs.mod }}"
          fi
