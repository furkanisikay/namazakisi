name: 🏪 Play Mağaza Kaydı

# Google Play magaza kaydini okur veya gunceller.
# Metinlerin tek dogru kaynagi docs/app-store/magaza-metinleri.md.
#
# `oku` varsayilandir ve HICBIR SEY DEGISTIRMEZ (edit acilir, okunur, silinir).
# `yaz` modu edit'i commit eder: degisiklik magazada yayina girer.
#
# Gorseller: `kare_run_id` verilirse o android-ekran-goruntuleri kosusunun ham
# kareleri indirilir, mockup'lar + one cikan gorsel BURADA uretilir ve artifact
# olarak birakilir. `oku` + `kare_run_id` = yalniz onizleme (yukleme yok).

on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'Ne yapılsın?'
        type: choice
        options:
          - oku
          - yaz
          - surumler
          - uretime-al
          - cihaz-kareleri
        default: oku
      surum:
        description: "uretime-al için sürüm (ör. 0.28.2); not docs/app-store/surum-notlari.md'den okunur"
        required: false
        default: ''
      oran:
        description: 'uretime-al için kademeli yayın oranı (ör. 0.2 = %20). Boş = herkese.'
        required: false
        default: ''
      kare_run_id:
        description: 'Görseller için android-ekran-goruntuleri çalışma kimliği (boş = yalnız metin)'
        required: false
        default: ''
      cihaz_run_id:
        description: 'Saat/TV kareleri için android-ekran-goruntuleri (tur=saat|tv|cihazlar) çalışma kimliği (cihaz-kareleri ve pazarlama görsellerindeki saat/TV kareleri)'
        required: false
        default: ''
      tv_pazarlama:
        description: 'cihaz-kareleri: TV için ham kare yerine pazarlama görselini yükle'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  magaza:
    name: 🏪 Play kaydı
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 🖼️ Android karelerini indir
        if: ${{ inputs.kare_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: android-ekran-goruntuleri
          path: indirilen
          run-id: ${{ inputs.kare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Ozellik turu kareleri (camideyim, alarm, tablet ...) ayni kosuda tur=ikisi ile
      # cekildiyse pazarlama setine girer; yoksa o gorseller atlanir.
      - name: 🧭 Özellik karelerini indir
        if: ${{ inputs.kare_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-ozellik-kareleri
          path: indirilen-ozellik
          run-id: ${{ inputs.kare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⌚ Saat karelerini indir
        if: ${{ inputs.cihaz_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-saat-kareleri
          path: indirilen-saat
          run-id: ${{ inputs.cihaz_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📺 TV karelerini indir
        if: ${{ inputs.cihaz_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-tv-kareleri
          path: indirilen-tv
          run-id: ${{ inputs.cihaz_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Pazarlama gorselleri (baslik + anlati + gercek ekran) TUM indirilen karelerden:
      # telefon (en fazla 8), tablet (7" + 10"), TV ve one cikan gorsel. Kareler
      # degisince gorseller de kendiliginden degisir (scripts/magaza-gorselleri/).
      - name: 🎨 Pazarlama görselleri ve öne çıkan görsel
        if: ${{ inputs.kare_run_id != '' }}
        run: |
          set -eo pipefail
          KAYNAK="--kaynak indirilen"
          for d in indirilen-ozellik indirilen-saat indirilen-tv; do [ -d "$d" ] && KAYNAK="$KAYNAK --kaynak $d"; done
          node scripts/magaza-gorselleri/uret.js $KAYNAK --cikis pazarlama --set play-telefon,play-tablet,tv --one-cikan | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la pazarlama/*

      - name: ⬆️ Pazarlama görsellerini yükle (önizleme)
        if: ${{ inputs.kare_run_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: play-pazarlama
          path: pazarlama/
          retention-days: 14

      - name: 🏪 Play kaydını ${{ inputs.mod }}
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          set -eo pipefail
          if [ "${{ inputs.mod }}" = "yaz" ] && [ -n "${{ inputs.kare_run_id }}" ]; then
            node scripts/play-magaza.js yaz --gorseller pazarlama/play-telefon --tablet pazarlama/play-tablet
          elif [ "${{ inputs.mod }}" = "cihaz-kareleri" ]; then
            # Saat: Play kare (1:1) ister → yuvarlak profil; TV: 16:9 kareler.
            mkdir -p saat tv
            [ -d indirilen-saat ] && find indirilen-saat -path '*yuvarlak*' -name '[0-9][0-9]-*.png' -exec cp {} saat/ \;
            if [ "${{ inputs.tv_pazarlama }}" = "true" ] && ls pazarlama/tv/*.png >/dev/null 2>&1; then
              cp pazarlama/tv/*.png tv/
            elif [ -d indirilen-tv ]; then
              find indirilen-tv -name '[0-9][0-9]-*.png' -not -path '*pazarlama*' -exec cp {} tv/ \;
            fi
            ls -la saat tv
            node scripts/play-magaza.js cihaz-kareleri --saat saat --tv tv
          elif [ "${{ inputs.mod }}" = "uretime-al" ]; then
            EK=""
            [ -n "${{ inputs.oran }}" ] && EK="--oran ${{ inputs.oran }}"
            node scripts/play-magaza.js uretime-al --surum "${{ inputs.surum }}" $EK
          else
            node scripts/play-magaza.js "${{ inputs.mod }}"
          fi
