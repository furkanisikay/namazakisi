name: 📸 iOS Ekran Görüntüleri

# App Store icin gerekli iPhone 6.9" ekran goruntulerini FIZIKSEL CIHAZ OLMADAN uretir:
# macOS runner'inda iOS Simulator var ve iPhone 16 Pro Max simulatoru tam olarak
# App Store'un istedigi 1320x2868 cozunurlukte kare verir (Apple simulator
# goruntulerini kabul eder; fastlane snapshot yillardir bunu yapar).
#
# Kareler once ARTIFACT olarak yuklenir (gozden gecirilebilsin); App Store Connect'e
# gonderim yalnizca `asc_yukle: true` ile yapilir.

on:
  workflow_dispatch:
    inputs:
      cihaz:
        description: 'Simülatör cihazı (boş = otomatik en yeni Pro Max)'
        required: false
        default: ''
      asc_yukle:
        description: "Kareleri App Store Connect kaydına yükle"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  kareler:
    name: 📸 Simülatörde kare çek
    # macos-26 (Xcode 26) BILINCLI: (a) idb-companion formulasi o macOS'un en yeni
    # Xcode'unu sart kosuyor — macos-15/Xcode 16.4'te "Xcode.app 26.0 is required"
    # ile reddediliyor; (b) TestFlight build'lerimiz zaten Xcode 26 SDK ile
    # derleniyor, yani kareler kullanicinin gercekte gordugu gorunumu yansitir.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: ⚙️ Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🍎 Araç sürümleri
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: 📱 Simülatörü başlat
        id: sim
        run: |
          set -eo pipefail
          ISTENEN="${{ inputs.cihaz }}"
          if [ -z "$ISTENEN" ]; then
            ISTENEN=$(xcrun simctl list devicetypes | grep -oE 'iPhone 1[6-9] Pro Max' | tail -1)
          fi
          [ -z "$ISTENEN" ] && ISTENEN="iPhone 16 Pro Max"
          echo "İstenen cihaz: $ISTENEN"

          UDID=$(xcrun simctl list devices available -j | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
              const j=JSON.parse(d), ad=process.argv[1];
              for (const k of Object.keys(j.devices).sort().reverse())
                for (const c of (j.devices[k]||[])) if (c.name===ad) { console.log(c.udid); process.exit(0); }
            });' "$ISTENEN")

          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).runtimes.filter(x=>x.platform==="iOS"&&x.isAvailable);console.log(r[r.length-1].identifier)})')
            DT=$(xcrun simctl list devicetypes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const t=JSON.parse(d).devicetypes.find(x=>x.name===process.argv[1]);console.log(t?t.identifier:"")});' "$ISTENEN")
            [ -z "$DT" ] && { echo "Cihaz tipi bulunamadı: $ISTENEN"; xcrun simctl list devicetypes | grep iPhone; exit 1; }
            UDID=$(xcrun simctl create "magaza-kare" "$DT" "$RT")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "cihaz=$ISTENEN" >> "$GITHUB_OUTPUT"

          # NOT: sistem dilini `simctl spawn ... defaults write` ile degistirmeye
          # KALKISMA — cfprefsd'yi bekleyip adimi suresiz kilitliyor (yasandi).
          # Uygulamanin kendi metinleri zaten Turkce; sistem dili yalnizca izin
          # diyalogunun dugme metnini etkiler ve betik iki dili de taniyor.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Magaza karelerinde temiz durum cubugu (Apple'in kendi kullandigi 09:41).
          xcrun simctl status_bar "$UDID" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl list devices | grep "$UDID"

      - name: 🏗️ Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: 🧩 CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: 🔨 Simülatör için Release derle
        id: derleme
        working-directory: ios
        run: |
          set -eo pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          # Sema ADINI PROJE DOSYASINDAN al. `-list` ciktisindaki schemes[0] ALFABETIKTIR
          # ve Pods semalarini da icerir: "EXApplication" secilip bir pod derlendi,
          # xcodebuild BASARILI dondu ama .app hic uretilmedi (yasandi).
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME="${PROJ%.xcodeproj}"
          if ! xcodebuild -workspace "$WS" -list -json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d).workspace.schemes;process.exit(s.includes(process.argv[1])?0:1)})' "$SCHEME"; then
            echo "Sema listesinde '$SCHEME' yok:"
            xcodebuild -workspace "$WS" -list
            exit 1
          fi
          echo "workspace=$WS scheme=$SCHEME"
          # Release: JS paketi uygulamanin icine gomulur (Metro sunucusu gerekmez).
          # CODE_SIGNING_ALLOWED=NO: simulator build'i imza istemez.
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          # .app'i BURADA dogrula: eksikligini bir sonraki adimda fark etmek,
          # hatayi urettigi adimdan koparir.
          APP=$(find build -name '*.app' -maxdepth 5 -not -path '*.dSYM*' | head -1)
          [ -z "$APP" ] && { echo "Derleme .app uretmedi"; find build -maxdepth 4 -name '*.app*' -print; exit 1; }
          echo "uretilen: $APP"

      - name: 🧰 idb kur (erişilebilirlik tabanlı dokunma)
        run: |
          set -eo pipefail
          brew tap facebook/fb
          # Homebrew artik ucuncu taraf tap'lerini acikca guvenilir istiyor;
          # `brew trust` olmadan kurulum "untrusted tap" ile reddediliyor.
          brew trust facebook/fb 2>/dev/null || brew trust --formula facebook/fb/idb-companion 2>/dev/null || true
          brew install idb-companion
          pipx install fb-idb || python3 -m pip install --break-system-packages fb-idb
          idb --help >/dev/null 2>&1 && echo "idb hazır"

      - name: 🚀 Uygulamayı kur ve depolamayı tohumla
        id: kurulum
        run: |
          set -eo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ios/build -name '*.app' -maxdepth 5 -not -path '*.dSYM*' | head -1)
          [ -z "$APP" ] && { echo ".app bulunamadı"; exit 1; }
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle: $BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          # Veri kabi ancak uygulama bir kez calistiktan sonra olusur.
          # Kible ekrani konum izni istiyor; bastan vermek diyalogu tumuyle onler.
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE" || true
          xcrun simctl location "$UDID" set 41.0082,28.9784 || true
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 10
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          KAP=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          node scripts/simulator-tohumla.js "$KAP" "$BUNDLE"
          # Tohumlama SESSIZCE etkisiz kalabilir (yanlis yol) — dosyayi dogrula.
          find "$KAP" -name manifest.json -print -exec sh -c 'echo "  anahtar sayisi: $(node -e "console.log(Object.keys(require(process.argv[1])).length)" "$1")"' _ {} \;
          xcrun simctl launch "$UDID" "$BUNDLE"

      - name: 📸 Kareleri çek
        run: |
          set -eo pipefail
          idb connect "${{ steps.sim.outputs.udid }}" || true
          mkdir -p kareler
          node scripts/simulator-ekranlari-cek.js kareler --udid "${{ steps.sim.outputs.udid }}" --bundle "${{ steps.kurulum.outputs.bundle }}"
          for f in kareler/*.png; do
            echo "$f -> $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' ')"
          done

      - name: ⬆️ Kareleri ve erişilebilirlik ağaçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ekran-goruntuleri
          path: kareler/
          retention-days: 14
          if-no-files-found: warn

      - name: 🏪 App Store Connect'e yükle
        if: ${{ inputs.asc_yukle }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: node scripts/app-store-ekran-goruntuleri.js kareler
