name: 📸 iOS Ekran Görüntüleri

# App Store icin gerekli iPhone 6.9" ekran goruntulerini FIZIKSEL CIHAZ OLMADAN uretir:
# macOS runner'inda iOS Simulator var ve iPhone 16 Pro Max simulatoru tam olarak
# App Store'un istedigi 1320x2868 cozunurlukte kare verir (Apple simulator
# goruntulerini kabul eder; fastlane snapshot yillardir bunu yapar).
#
# Kareler once ARTIFACT olarak yuklenir (gozden gecirilebilsin); App Store Connect'e
# gonderim yalnizca `asc_yukle: true` ile yapilir.
#
# `tur` girdisi:
#   magaza  (varsayilan) — magaza kareleri + mockup; ozellik turu eklenmeden
#           oncekiyle BIREBIR ayni.
#   ozellik — yeni ekranlarin kareleri (`kareler-ozellik/iphone-<tema>/`, artifact
#           `ios-ozellik-kareleri`; scripts/simulator-ozellik-cek.js). ASC'ye
#           GONDERILMEZ.
#   ikisi   — ikisi de, ayni derlemeyle.
#   ipad    — magaza kareleri iPad Pro 13" simulatorunde (2064x2752; uygulama iPad'de
#           calistigi icin App Store'da ZORUNLU set). Artifact `ios-ipad-ekran-goruntuleri`;
#           ASC'ye `tur=asc asc_islem=ekran-yukle asc_ipad_run_id=<bu kosu>` ile gider.
#   tv      — YALNIZ Apple TV panosu kareleri (ayri is `tv-kareler`; artifact
#           `ios-tv-kareleri`). TV hedefi (`NAMAZ_IOS_TV=1`) yalniz bu yolda acilir.
#   saat    — YALNIZ Apple Watch kareleri (ayri is `saat-kareler`; artifact
#           `ios-saat-kareleri`). iPhone isi bu degerde HIC kosmaz; saat hedefi
#           (`NAMAZ_IOS_SAAT=1`) yalniz bu yolda acilir. ASC'ye GONDERILMEZ.
#   asc     — KARE CEKILMEZ; App Store Connect surum islemi (`asc_islem`), ubuntu
#           uzerinde `scripts/app-store-surum.js`. ASC anahtari (issuer dahil)
#           yalniz GitHub secret'larinda oldugu icin API isleri buradan yurur.
#           Sira: durum -> surum-hazirla -> ekran-yukle (istege bagli) ->
#           build-bagla -> incelemeye-gonder. Gonderim bilincli olarak ayri
#           bir dispatch'tir.

on:
  workflow_dispatch:
    inputs:
      cihaz:
        description: 'Simülatör cihazı (boş = otomatik en yeni Pro Max)'
        required: false
        default: ''
      asc_yukle:
        description: "Kareleri App Store Connect kaydına yükle (yalnız mağaza turu)"
        type: boolean
        required: false
        default: false
      dil:
        description: 'Uygulama dili (tr = Türkçe, mağaza ve README kareleri; diğerleri = o dilin kanıt turu, artifact adlarına -<dil> eklenir)'
        type: choice
        required: false
        default: 'tr'
        options:
          - tr
          - en
          - id
          - de
          - fr
          - bs
          - ru
          - ms
      tur:
        description: 'Hangi kareler: magaza (App Store kareleri) | ozellik (yeni ekranlar turu) | ikisi | ipad (iPad 13" mağaza kareleri) | tv (Apple TV) | saat (Apple Watch) | asc (kare yok, App Store Connect işlemi)'
        type: choice
        required: false
        default: 'magaza'
        options:
          - magaza
          - ozellik
          - ikisi
          - ipad
          - tv
          - saat
          - asc
      asc_islem:
        description: 'tur=asc için: durum | surum-hazirla | ekran-yukle | build-bagla | incelemeye-gonder | icloud-durum | icloud-ac (yalnız App ID iCloud yeteneği)'
        type: choice
        required: false
        default: 'durum'
        options:
          - durum
          - surum-hazirla
          - ekran-yukle
          - build-bagla
          - incelemeye-gonder
          - icloud-durum
          - icloud-ac
      asc_surum:
        description: 'tur=asc için sürüm (boş = app.json)'
        required: false
        default: ''
      asc_kare_run_id:
        description: 'ekran-yukle için mağaza karelerini üreten iOS Ekran Görüntüleri çalışma kimliği'
        required: false
        default: ''
      asc_ipad_run_id:
        description: 'ekran-yukle için iPad karelerini üreten çalışma kimliği (tur=ipad; boş = iPad kareleri yüklenmez)'
        required: false
        default: ''
      asc_pazarlama_run_id:
        description: 'ekran-yukle için magaza-gorselleri.yml çalışma kimliği (magaza-pazarlama: iPhone 6.9 + 6.3, iPad 13, Apple Watch). Verilirse diğer kare kimlikleri kullanılmaz.'
        required: false
        default: ''
      asc_saat_run_id:
        description: 'ekran-yukle için Apple Watch karelerini üreten çalışma kimliği (tur=saat; boş = saat kareleri yüklenmez)'
        required: false
        default: ''
      ozellik_koyu:
        description: 'Özellik turunu koyu temada da çek'
        type: boolean
        required: false
        default: false
      saat_hedef:
        description: 'Apple Watch kareleri hangi vakitte: ogle (dilim hilesi) | simdi (gerçek İstanbul vakti, telefon kareleriyle aynı)'
        type: choice
        options: [ogle, simdi]
        default: ogle

permissions:
  contents: read

env:
  # Tohum betiği (`scripts/magaza-tohum-verisi.js`) uygulamanın dil kaydını buna göre yazar.
  TOHUM_DIL: ${{ inputs.dil || 'tr' }}

jobs:
  kareler:
    name: 📸 Simülatörde kare çek
    # Apple Watch turu ve ASC islemi ayri istir (asagida); iPhone hatti o degerlerde kosmaz.
    if: ${{ inputs.tur != 'saat' && inputs.tur != 'asc' && inputs.tur != 'tv' }}
    # macos-26 (Xcode 26) BILINCLI: (a) idb-companion formulasi o macOS'un en yeni
    # Xcode'unu sart kosuyor — macos-15/Xcode 16.4'te "Xcode.app 26.0 is required"
    # ile reddediliyor; (b) TestFlight build'lerimiz zaten Xcode 26 SDK ile
    # derleniyor, yani kareler kullanicinin gercekte gordugu gorunumu yansitir.
    runs-on: macos-26
    # Ozellik turu (her bolum temiz acilis + yeniden tohum) ayni iste kosar.
    timeout-minutes: 150
    # Simulator UTC'dir; tohum Istanbul'dur. `simctl launch` SIMCTL_CHILD_ onekli
    # degiskenleri uygulamaya gecirir → vakitler Istanbul saatiyle cizilir
    # (yoksa ogle "09:55" gibi 3 saat geri gorunur).
    env:
      SIMCTL_CHILD_TZ: Europe/Istanbul

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🍎 Araç sürümleri
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: 📱 Simülatörü başlat
        id: sim
        run: |
          set -eo pipefail
          ISTENEN="${{ inputs.cihaz }}"
          if [ "${{ inputs.tur }}" = "ipad" ]; then
            # iPad 13" (M4/M5) = 2064x2752, App Store'un zorunlu iPad seti.
            [ -z "$ISTENEN" ] && ISTENEN=$(xcrun simctl list devicetypes | grep -oE 'iPad Pro 13-inch \(M[0-9]+\)' | tail -1)
            [ -z "$ISTENEN" ] && ISTENEN="iPad Pro 13-inch (M4)"
          fi
          if [ -z "$ISTENEN" ]; then
            ISTENEN=$(xcrun simctl list devicetypes | grep -oE 'iPhone 1[6-9] Pro Max' | tail -1)
          fi
          [ -z "$ISTENEN" ] && ISTENEN="iPhone 16 Pro Max"
          echo "İstenen cihaz: $ISTENEN"

          UDID=$(xcrun simctl list devices available -j | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
              const j=JSON.parse(d), ad=process.argv[1];
              for (const k of Object.keys(j.devices).sort().reverse())
                for (const c of (j.devices[k]||[])) if (c.name===ad) { console.log(c.udid); process.exit(0); }
            });' "$ISTENEN")

          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).runtimes.filter(x=>x.platform==="iOS"&&x.isAvailable);console.log(r[r.length-1].identifier)})')
            DT=$(xcrun simctl list devicetypes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const t=JSON.parse(d).devicetypes.find(x=>x.name===process.argv[1]);console.log(t?t.identifier:"")});' "$ISTENEN")
            [ -z "$DT" ] && { echo "Cihaz tipi bulunamadı: $ISTENEN"; xcrun simctl list devicetypes | grep -E 'iPhone|iPad'; exit 1; }
            UDID=$(xcrun simctl create "magaza-kare" "$DT" "$RT")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "cihaz=$ISTENEN" >> "$GITHUB_OUTPUT"

          # NOT: sistem dilini `simctl spawn ... defaults write` ile degistirmeye
          # KALKISMA — cfprefsd'yi bekleyip adimi suresiz kilitliyor (yasandi).
          # Uygulamanin kendi metinleri zaten Turkce; sistem dili yalnizca izin
          # diyalogunun dugme metnini etkiler ve betik iki dili de taniyor.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # iPad durum cubugu TARIH de yazar ("9:41 AM Tue Oct 20") → Turkce bolge + 24 saat.
          # Saat hattinin (`simulator-saat-cek.sh > yerellestir`) yolu: tercih dosyasi ilk
          # acilista olusur, simulator KAPALIYKEN yazilir, sonra yeniden acilir.
          if [ "${{ inputs.tur }}" = "ipad" ]; then
            TERCIH="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Preferences/.GlobalPreferences.plist"
            xcrun simctl shutdown "$UDID" || true
            # iOS simulatoru dosyayi ilk acilista HER ZAMAN olusturmuyor (yasandi); cihazin
            # veri dizini varsa PlistBuddy dosyayi kendisi olusturur. Veri dizinini elle
            # kurmak cihazi bozar (saat hatti dersi) → yalniz dizin varken.
            if [ ! -f "$TERCIH" ] && [ -d "$(dirname "$(dirname "$(dirname "$TERCIH")")")" ]; then
              mkdir -p "$(dirname "$TERCIH")"
              /usr/libexec/PlistBuddy -c "Add :AppleLocale string tr_TR" "$TERCIH" || true
            fi
            if [ -f "$TERCIH" ]; then
              /usr/libexec/PlistBuddy -c "Delete :AppleLanguages" "$TERCIH" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :AppleLanguages array" -c "Add :AppleLanguages:0 string tr-TR" "$TERCIH"
              /usr/libexec/PlistBuddy -c "Delete :AppleLocale" "$TERCIH" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :AppleLocale string tr_TR" "$TERCIH"
              /usr/libexec/PlistBuddy -c "Delete :AppleICUForce24HourTime" "$TERCIH" >/dev/null 2>&1 || true
              /usr/libexec/PlistBuddy -c "Add :AppleICUForce24HourTime bool true" "$TERCIH"
            else
              echo "UYARI: tercih dosyası yok, bölge ayarlanmadı"
            fi
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
          fi
          # Magaza karelerinde temiz durum cubugu (Apple'in kendi kullandigi 09:41).
          xcrun simctl status_bar "$UDID" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl list devices | grep "$UDID"

      - name: 🏗️ Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          # Derleme `-sdk iphonesimulator` ile: app.json'da saat bayragi acikken watchOS
          # hedefi iOS SDK'siyla derlenip duserdi. Telefon/iPad karelerinde saat gerekmez
          # (saat kareleri ayri `saat-kareler` isinde).
          NAMAZ_IOS_SAAT: '0'

      - name: 🧩 CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: 🔨 Simülatör için Release derle
        id: derleme
        working-directory: ios
        run: |
          set -eo pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          # Sema ADINI PROJE DOSYASINDAN al. `-list` ciktisindaki schemes[0] ALFABETIKTIR
          # ve Pods semalarini da icerir: "EXApplication" secilip bir pod derlendi,
          # xcodebuild BASARILI dondu ama .app hic uretilmedi (yasandi).
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME="${PROJ%.xcodeproj}"
          if ! xcodebuild -workspace "$WS" -list -json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d).workspace.schemes;process.exit(s.includes(process.argv[1])?0:1)})' "$SCHEME"; then
            echo "Sema listesinde '$SCHEME' yok:"
            xcodebuild -workspace "$WS" -list
            exit 1
          fi
          echo "workspace=$WS scheme=$SCHEME"
          # Release: JS paketi uygulamanin icine gomulur (Metro sunucusu gerekmez).
          # CODE_SIGNING_ALLOWED=NO: simulator build'i imza istemez.
          # `-sdk iphonesimulator` VERILMEZ: Apple Watch hedefi (withNamazSaat etkin) varken
          # tum hedeflerin SDKROOT'unu ezer, watchOS kodu iPhone SDK'siyla derlenip duser.
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          # .app'i BURADA dogrula: eksikligini bir sonraki adimda fark etmek,
          # hatayi urettigi adimdan koparir.
          # Saat hedefi açıkken build/ altında NamazSaat.app (watchsimulator) da var → yalnız iPhone ürünü.
          APP=$(find build -path '*-iphonesimulator/*' -name '*.app' -maxdepth 5 -not -path '*.dSYM*' -not -path '*/Watch/*' | head -1)
          [ -z "$APP" ] && { echo "Derleme .app uretmedi"; find build -maxdepth 4 -name '*.app*' -print; exit 1; }
          echo "uretilen: $APP"

      - name: 🧰 idb kur (erişilebilirlik tabanlı dokunma)
        run: |
          set -eo pipefail
          brew tap facebook/fb
          # Homebrew artik ucuncu taraf tap'lerini acikca guvenilir istiyor;
          # `brew trust` olmadan kurulum "untrusted tap" ile reddediliyor.
          brew trust facebook/fb 2>/dev/null || brew trust --formula facebook/fb/idb-companion 2>/dev/null || true
          brew install idb-companion
          pipx install fb-idb || python3 -m pip install --break-system-packages fb-idb
          idb --help >/dev/null 2>&1 && echo "idb hazır"

      - name: 🚀 Uygulamayı kur ve depolamayı tohumla
        id: kurulum
        run: |
          set -eo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ios/build -path '*-iphonesimulator/*' -name '*.app' -maxdepth 5 -not -path '*.dSYM*' -not -path '*/Watch/*' | head -1)
          [ -z "$APP" ] && { echo ".app bulunamadı"; exit 1; }
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle: $BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          # Veri kabi ancak uygulama bir kez calistiktan sonra olusur.
          # Kible ekrani konum izni istiyor; bastan vermek diyalogu tumuyle onler.
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE" || true
          xcrun simctl location "$UDID" set 41.0082,28.9784 || true
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 10
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          KAP=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          node scripts/simulator-tohumla.js "$KAP" "$BUNDLE"
          # Tohumlama SESSIZCE etkisiz kalabilir (yanlis yol) — dosyayi dogrula.
          find "$KAP" -name manifest.json -print -exec sh -c 'echo "  anahtar sayisi: $(node -e "console.log(Object.keys(require(process.argv[1])).length)" "$1")"' _ {} \;
          xcrun simctl launch "$UDID" "$BUNDLE"

      - name: 📸 Kareleri çek
        if: ${{ inputs.tur != 'ozellik' }}
        run: |
          set -eo pipefail
          idb connect "${{ steps.sim.outputs.udid }}" || true
          mkdir -p kareler
          node scripts/simulator-ekranlari-cek.js kareler --udid "${{ steps.sim.outputs.udid }}" --bundle "${{ steps.kurulum.outputs.bundle }}"
          for f in kareler/*.png; do
            echo "$f -> $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' ')"
          done

      # iPad geniş ekran: dikey + yatay (Bugün üç sütun, Ayarlar/Kaza ana-ayrıntı, ev ekranı).
      # Mağaza karelerinden SONRA: yatay için .app yeniden kurulur.
      - name: 📐 iPad geniş ekran kareleri (dikey + yatay)
        if: ${{ !cancelled() && inputs.tur == 'ipad' }}
        run: |
          APP=$(find ios/build -name '*.app' -maxdepth 5 -not -path '*.dSYM*' | head -1)
          node scripts/simulator-ipad-genis.js "${{ steps.sim.outputs.udid }}" "${{ steps.kurulum.outputs.bundle }}" "$APP" kareler-genis

      - name: 🎨 Mockup üret
        if: ${{ inputs.tur != 'ozellik' }}
        run: |
          # Magazaya giden kare ham ekran goruntusu DEGIL, basligi ve cihaz
          # cercevesi olan mockup'tir. Adimlar Chrome'u headless kullanir.
          PLATFORM=ios
          [ "${{ inputs.tur }}" = "ipad" ] && PLATFORM=ipad
          node scripts/magaza-mockup.js kareler mockup --platform "$PLATFORM"

      - name: ⬆️ Kareleri, mockup'ları ve erişilebilirlik ağaçlarını yükle
        if: ${{ always() && inputs.tur != 'ozellik' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tur == 'ipad' && 'ios-ipad-ekran-goruntuleri' || 'ios-ekran-goruntuleri' }}${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: |
            kareler/
            mockup/
            kareler-genis/
          retention-days: 14
          if-no-files-found: warn

      # --- OZELLIK TURU (magaza turuna dokunmaz; ayri klasor + ayri artifact) ---
      # Magaza adimi dustuyse de kossun (`!cancelled()`): iki tur bagimsiz.
      - name: 🧭 Özellik turu
        if: ${{ !cancelled() && (inputs.tur == 'ozellik' || inputs.tur == 'ikisi') }}
        run: |
          set -eo pipefail
          idb connect "${{ steps.sim.outputs.udid }}" || true
          TEMALAR="acik"
          [ "${{ inputs.ozellik_koyu }}" = "true" ] && TEMALAR="acik koyu"
          for tema in $TEMALAR; do
            # Bir tema dusse de digeri cekilsin.
            node scripts/simulator-ozellik-cek.js "kareler-ozellik/iphone-$tema" \
              --udid "${{ steps.sim.outputs.udid }}" --bundle "${{ steps.kurulum.outputs.bundle }}" --tema "$tema" \
              || echo "UYARI: özellik turu ($tema) hatayla bitti"
          done

      - name: 🧾 Özellik kareleri özeti
        if: ${{ always() && (inputs.tur == 'ozellik' || inputs.tur == 'ikisi') }}
        run: node scripts/ozellik-kare-ozeti.js kareler-ozellik ios | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ⬆️ Özellik karelerini yükle
        if: ${{ always() && (inputs.tur == 'ozellik' || inputs.tur == 'ikisi') }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-ozellik-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          # Kareler + her adimin erisilebilirlik agaci (agac/*.json): bir adim
          # tutmazsa ekranda hangi ogelerin oldugu oradan gorulur.
          path: kareler-ozellik/
          retention-days: 14
          if-no-files-found: warn

      - name: 🏪 App Store Connect'e yükle
        if: ${{ inputs.asc_yukle && inputs.tur != 'ozellik' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        # --degistir: settekiler once silinir; yoksa yeni kareler arkaya eklenir.
        run: |
          TIP=APP_IPHONE_67
          [ "${{ inputs.tur }}" = "ipad" ] && TIP=APP_IPAD_PRO_3GEN_129
          node scripts/app-store-ekran-goruntuleri.js mockup --tip "$TIP" --degistir

  # --- APPLE WATCH TURU (issue #285) — iPhone isinden BAGIMSIZ, yalniz `tur: saat` ---
  # Yalniz saat hedefleri derlenir (`-target NamazSaat -sdk watchsimulator`): saat
  # hedefleri pod'a ve RN'e baglanmaz → pod install ve iPhone derlemesi (~25 dk) gerekmez.
  # Veri WatchConnectivity'den DEGIL, baslatma ortamindan gelir (yalniz simulator
  # derlemesinde okunur; gerekce `scripts/simulator-saat-cek.sh` basinda).
  saat-kareler:
    name: ⌚ Apple Watch kareleri
    if: ${{ inputs.tur == 'saat' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      # Bilgi: runner'daki Xcode / simulator cihaz turleri (ornegin katlanabilir iPhone Duo
      # simulatoru var mi). Yalniz listeler, hicbir seyi degistirmez.
      - name: 🔎 Xcode ve simülatör cihaz türleri
        run: |
          xcodebuild -version || true
          xcrun simctl list devicetypes | tee -a "$GITHUB_STEP_SUMMARY" || true
          xcrun simctl list runtimes | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🍎 Araç sürümleri ve watchOS runtime
        run: |
          set -eo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || true
          if ! xcrun simctl list runtimes | grep -q '^watchOS'; then
            echo "watchOS simülatör runtime'ı yok — indiriliyor"
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes | grep -iE 'ios|watchos'

      - name: 🏗️ Expo prebuild (iOS, saat hedefi AÇIK)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          # Bayrak yalniz bu imzasiz simulator derlemesi icin acilir (EAS'te tanimli degil).
          NAMAZ_IOS_SAAT: '1'

      - name: 🔨 Saat uygulamasını derle (watchOS simülatör, Release)
        id: saat_derleme
        working-directory: ios
        run: |
          set -eo pipefail
          PROJ=$(ls -d *.xcodeproj | head -1)
          # Yalniz saat hedefleri (`-target`): -sdk watchsimulator yalniz watchOS
          # hedeflerine uygulanir, iPhone hedefi derlenmez. Release: kullanicinin
          # gordugu derleme.
          xcodebuild \
            -project "$PROJ" \
            -target NamazSaat \
            -configuration Release \
            -sdk watchsimulator \
            SYMROOT="$PWD/build-saat" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          APP="$PWD/build-saat/Release-watchsimulator/NamazSaat.app"
          [ -d "$APP" ] || { echo "NamazSaat.app üretilmedi"; find build-saat -maxdepth 3 -name '*.app' -print; exit 1; }
          [ -d "$APP/PlugIns/NamazSaatWidget.appex" ] || { echo "Komplikasyon uzantısı gömülmedi"; ls "$APP"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "uretilen: $APP"

      - name: 📸 Kareleri çek
        env:
          SAAT_APP: ${{ steps.saat_derleme.outputs.app }}
          SAAT_HEDEF: ${{ inputs.saat_hedef || 'ogle' }}
        run: bash scripts/simulator-saat-cek.sh kareler-saat "$SAAT_APP" videolar-saat

      - name: ⬆️ Saat karelerini yükle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-saat-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: kareler-saat/
          retention-days: 14
          if-no-files-found: warn

      # Animasyon kayitlari (simctl recordVideo) AYRI artifact: ASC kare yuklemesi bunlari gormesin.
      - name: ⬆️ Saat animasyon videolarını yükle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-saat-videolari${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: videolar-saat/
          retention-days: 14
          if-no-files-found: warn

  # --- APPLE TV TURU — iPhone isinden BAGIMSIZ, yalniz `tur: tv` ---
  # TV hedefi pod'a ve RN'e baglanmaz → pod install ve iPhone derlemesi gerekmez.
  tv-kareler:
    name: 📺 Apple TV kareleri
    if: ${{ inputs.tur == 'tv' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIMCTL_CHILD_TZ: Europe/Istanbul
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🏗️ Expo prebuild (iOS, TV hedefi AÇIK)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          NAMAZ_IOS_TV: '1'

      - name: 🔨 Apple TV uygulamasını derle (tvOS simülatör, Release)
        working-directory: ios
        run: |
          set -eo pipefail
          PROJ=$(ls -d *.xcodeproj | head -1)
          xcodebuild -project "$PROJ" -target NamazTV -configuration Release -sdk appletvsimulator \
            CODE_SIGNING_ALLOWED=NO -quiet
          [ -d build/Release-appletvsimulator/NamazTV.app ] || { echo "NamazTV.app üretilmedi"; exit 1; }

      - name: 📸 Kareleri çek
        run: |
          set -eo pipefail
          RT=$(xcrun simctl list runtimes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).runtimes.filter(x=>x.platform==="tvOS"&&x.isAvailable);console.log(r.length?r[r.length-1].identifier:"")})')
          [ -z "$RT" ] && { echo "tvOS simülatör çalışma zamanı yok"; xcrun simctl list runtimes; exit 1; }
          DT=$(xcrun simctl list devicetypes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const t=JSON.parse(d).devicetypes.filter(x=>/Apple TV 4K/.test(x.name));console.log(t.length?t[t.length-1].identifier:"")})')
          [ -z "$DT" ] && { echo "Apple TV 4K cihaz tipi yok"; xcrun simctl list devicetypes | grep -i tv; exit 1; }
          UDID=$(xcrun simctl create "tv-kare" "$DT" "$RT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=ios/build/Release-appletvsimulator/NamazTV.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p kareler-tv
          # 1) Ilk acilis: il secimi (kayit yok).
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 12
          xcrun simctl io "$UDID" screenshot kareler-tv/01-il-secimi.png
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          # 2) Pano: `-il_plaka 34` arguman alani UserDefaults okumasini ezer (Istanbul).
          xcrun simctl launch "$UDID" "$BUNDLE" -il_plaka 34
          sleep 12
          xcrun simctl io "$UDID" screenshot kareler-tv/02-pano.png
          for f in kareler-tv/*.png; do echo "$f -> $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' ')"; done

      - name: ⬆️ TV karelerini yükle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-tv-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: kareler-tv/
          retention-days: 14
          if-no-files-found: warn

  # --- APP STORE CONNECT ISLEMI — kare cekilmez, yalniz `tur: asc` ---
  asc:
    name: 🏪 App Store Connect (${{ inputs.asc_islem }})
    if: ${{ inputs.tur == 'asc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 🎨 Pazarlama görsellerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' && inputs.asc_pazarlama_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: magaza-pazarlama
          path: pazarlama
          run-id: ${{ inputs.asc_pazarlama_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🖼️ Mağaza karelerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' && inputs.asc_pazarlama_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          name: ios-ekran-goruntuleri
          path: indirilen
          run-id: ${{ inputs.asc_kare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 iPad karelerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' && inputs.asc_pazarlama_run_id == '' && inputs.asc_ipad_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ios-ipad-ekran-goruntuleri
          path: indirilen-ipad
          run-id: ${{ inputs.asc_ipad_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⌚ Apple Watch karelerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' && inputs.asc_pazarlama_run_id == '' && inputs.asc_saat_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ios-saat-kareleri${{ (inputs.dil && inputs.dil != 'tr') && format('-{0}', inputs.dil) || '' }}
          path: indirilen-saat
          run-id: ${{ inputs.asc_saat_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏪 İşlem
        env:
          ISLEM: ${{ inputs.asc_islem }}
          SURUM: ${{ inputs.asc_surum }}
        run: |
          set -eo pipefail
          if [ "$ISLEM" = "icloud-durum" ] || [ "$ISLEM" = "icloud-ac" ]; then
            # Yalniz ana App ID'nin ICLOUD yetenegi (scripts/asc-icloud.js).
            node scripts/asc-icloud.js "${ISLEM#icloud-}"
          elif [ "$ISLEM" = "ekran-yukle" ] && [ -d pazarlama ]; then
            # Pazarlama gorselleri (scripts/magaza-gorselleri): her set kendi gorunum tipine,
            # settekilerin YERINE (--degistir). Yalniz ust klasordeki NN-*.png yuklenir;
            # magaza-disi/ alt klasoru yuklenmez.
            node scripts/app-store-ekran-goruntuleri.js pazarlama/iphone --tip APP_IPHONE_67 --degistir
            node scripts/app-store-ekran-goruntuleri.js pazarlama/iphone-orta --tip APP_IPHONE_61 --degistir
            node scripts/app-store-ekran-goruntuleri.js pazarlama/ipad --tip APP_IPAD_PRO_3GEN_129 --degistir
            node scripts/app-store-ekran-goruntuleri.js pazarlama/apple-watch --tip APP_WATCH_ULTRA --degistir
          elif [ "$ISLEM" = "ekran-yukle" ]; then
            # --degistir: settekiler once silinir; yoksa yeni kareler arkaya eklenir.
            node scripts/app-store-ekran-goruntuleri.js indirilen/mockup --degistir
            # iPad 13" (2064x2752) = APP_IPAD_PRO_3GEN_129. supportsTablet acikken ZORUNLU;
            # eksikse incelemeye-gonder bunu soyler.
            if [ -d indirilen-ipad ]; then
              node scripts/app-store-ekran-goruntuleri.js indirilen-ipad/mockup --tip APP_IPAD_PRO_3GEN_129 --degistir
            fi
            # Apple Watch kareleri (Ultra 3 simülatörü 422x514 = APP_WATCH_ULTRA).
            if [ -d indirilen-saat ]; then
              node scripts/app-store-ekran-goruntuleri.js indirilen-saat --tip APP_WATCH_ULTRA --degistir
            fi
          elif [ -n "$SURUM" ]; then
            node scripts/app-store-surum.js "$ISLEM" --surum "$SURUM"
          else
            node scripts/app-store-surum.js "$ISLEM"
          fi
