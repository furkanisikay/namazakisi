name: 📸 iOS Ekran Görüntüleri

# App Store icin gerekli iPhone 6.9" ekran goruntulerini FIZIKSEL CIHAZ OLMADAN uretir:
# macOS runner'inda iOS Simulator var ve iPhone 16 Pro Max simulatoru tam olarak
# App Store'un istedigi 1320x2868 cozunurlukte kare verir (Apple simulator
# goruntulerini kabul eder; fastlane snapshot yillardir bunu yapar).
#
# Kareler once ARTIFACT olarak yuklenir (gozden gecirilebilsin); App Store Connect'e
# gonderim yalnizca `asc_yukle: true` ile yapilir.
#
# `tur` girdisi:
#   magaza  (varsayilan) — magaza kareleri + mockup; ozellik turu eklenmeden
#           oncekiyle BIREBIR ayni.
#   ozellik — yeni ekranlarin kareleri (`kareler-ozellik/iphone-<tema>/`, artifact
#           `ios-ozellik-kareleri`; scripts/simulator-ozellik-cek.js). ASC'ye
#           GONDERILMEZ.
#   ikisi   — ikisi de, ayni derlemeyle.
#   saat    — YALNIZ Apple Watch kareleri (ayri is `saat-kareler`; artifact
#           `ios-saat-kareleri`). iPhone isi bu degerde HIC kosmaz; saat hedefi
#           (`NAMAZ_IOS_SAAT=1`) yalniz bu yolda acilir. ASC'ye GONDERILMEZ.
#   asc     — KARE CEKILMEZ; App Store Connect surum islemi (`asc_islem`), ubuntu
#           uzerinde `scripts/app-store-surum.js`. ASC anahtari (issuer dahil)
#           yalniz GitHub secret'larinda oldugu icin API isleri buradan yurur.
#           Sira: durum -> surum-hazirla -> ekran-yukle (istege bagli) ->
#           build-bagla -> incelemeye-gonder. Gonderim bilincli olarak ayri
#           bir dispatch'tir.

on:
  workflow_dispatch:
    inputs:
      cihaz:
        description: 'Simülatör cihazı (boş = otomatik en yeni Pro Max)'
        required: false
        default: ''
      asc_yukle:
        description: "Kareleri App Store Connect kaydına yükle (yalnız mağaza turu)"
        type: boolean
        required: false
        default: false
      tur:
        description: 'Hangi kareler: magaza (App Store kareleri) | ozellik (yeni ekranlar turu) | ikisi | saat (Apple Watch) | asc (kare yok, App Store Connect işlemi)'
        type: choice
        required: false
        default: 'magaza'
        options:
          - magaza
          - ozellik
          - ikisi
          - saat
          - asc
      asc_islem:
        description: 'tur=asc için: durum | surum-hazirla | ekran-yukle | build-bagla | incelemeye-gonder'
        type: choice
        required: false
        default: 'durum'
        options:
          - durum
          - surum-hazirla
          - ekran-yukle
          - build-bagla
          - incelemeye-gonder
      asc_surum:
        description: 'tur=asc için sürüm (boş = app.json)'
        required: false
        default: ''
      asc_kare_run_id:
        description: 'ekran-yukle için mağaza karelerini üreten iOS Ekran Görüntüleri çalışma kimliği'
        required: false
        default: ''
      asc_saat_run_id:
        description: 'ekran-yukle için Apple Watch karelerini üreten çalışma kimliği (tur=saat; boş = saat kareleri yüklenmez)'
        required: false
        default: ''
      ozellik_koyu:
        description: 'Özellik turunu koyu temada da çek'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  kareler:
    name: 📸 Simülatörde kare çek
    # Apple Watch turu ve ASC islemi ayri istir (asagida); iPhone hatti o degerlerde kosmaz.
    if: ${{ inputs.tur != 'saat' && inputs.tur != 'asc' }}
    # macos-26 (Xcode 26) BILINCLI: (a) idb-companion formulasi o macOS'un en yeni
    # Xcode'unu sart kosuyor — macos-15/Xcode 16.4'te "Xcode.app 26.0 is required"
    # ile reddediliyor; (b) TestFlight build'lerimiz zaten Xcode 26 SDK ile
    # derleniyor, yani kareler kullanicinin gercekte gordugu gorunumu yansitir.
    runs-on: macos-26
    # Ozellik turu (her bolum temiz acilis + yeniden tohum) ayni iste kosar.
    timeout-minutes: 150
    # Simulator UTC'dir; tohum Istanbul'dur. `simctl launch` SIMCTL_CHILD_ onekli
    # degiskenleri uygulamaya gecirir → vakitler Istanbul saatiyle cizilir
    # (yoksa ogle "09:55" gibi 3 saat geri gorunur).
    env:
      SIMCTL_CHILD_TZ: Europe/Istanbul

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🍎 Araç sürümleri
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: 📱 Simülatörü başlat
        id: sim
        run: |
          set -eo pipefail
          ISTENEN="${{ inputs.cihaz }}"
          if [ -z "$ISTENEN" ]; then
            ISTENEN=$(xcrun simctl list devicetypes | grep -oE 'iPhone 1[6-9] Pro Max' | tail -1)
          fi
          [ -z "$ISTENEN" ] && ISTENEN="iPhone 16 Pro Max"
          echo "İstenen cihaz: $ISTENEN"

          UDID=$(xcrun simctl list devices available -j | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
              const j=JSON.parse(d), ad=process.argv[1];
              for (const k of Object.keys(j.devices).sort().reverse())
                for (const c of (j.devices[k]||[])) if (c.name===ad) { console.log(c.udid); process.exit(0); }
            });' "$ISTENEN")

          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const r=JSON.parse(d).runtimes.filter(x=>x.platform==="iOS"&&x.isAvailable);console.log(r[r.length-1].identifier)})')
            DT=$(xcrun simctl list devicetypes -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const t=JSON.parse(d).devicetypes.find(x=>x.name===process.argv[1]);console.log(t?t.identifier:"")});' "$ISTENEN")
            [ -z "$DT" ] && { echo "Cihaz tipi bulunamadı: $ISTENEN"; xcrun simctl list devicetypes | grep iPhone; exit 1; }
            UDID=$(xcrun simctl create "magaza-kare" "$DT" "$RT")
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "cihaz=$ISTENEN" >> "$GITHUB_OUTPUT"

          # NOT: sistem dilini `simctl spawn ... defaults write` ile degistirmeye
          # KALKISMA — cfprefsd'yi bekleyip adimi suresiz kilitliyor (yasandi).
          # Uygulamanin kendi metinleri zaten Turkce; sistem dili yalnizca izin
          # diyalogunun dugme metnini etkiler ve betik iki dili de taniyor.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Magaza karelerinde temiz durum cubugu (Apple'in kendi kullandigi 09:41).
          xcrun simctl status_bar "$UDID" override --time "09:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl list devices | grep "$UDID"

      - name: 🏗️ Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: 🧩 CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: 🔨 Simülatör için Release derle
        id: derleme
        working-directory: ios
        run: |
          set -eo pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          # Sema ADINI PROJE DOSYASINDAN al. `-list` ciktisindaki schemes[0] ALFABETIKTIR
          # ve Pods semalarini da icerir: "EXApplication" secilip bir pod derlendi,
          # xcodebuild BASARILI dondu ama .app hic uretilmedi (yasandi).
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME="${PROJ%.xcodeproj}"
          if ! xcodebuild -workspace "$WS" -list -json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d).workspace.schemes;process.exit(s.includes(process.argv[1])?0:1)})' "$SCHEME"; then
            echo "Sema listesinde '$SCHEME' yok:"
            xcodebuild -workspace "$WS" -list
            exit 1
          fi
          echo "workspace=$WS scheme=$SCHEME"
          # Release: JS paketi uygulamanin icine gomulur (Metro sunucusu gerekmez).
          # CODE_SIGNING_ALLOWED=NO: simulator build'i imza istemez.
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          # .app'i BURADA dogrula: eksikligini bir sonraki adimda fark etmek,
          # hatayi urettigi adimdan koparir.
          APP=$(find build -name '*.app' -maxdepth 5 -not -path '*.dSYM*' | head -1)
          [ -z "$APP" ] && { echo "Derleme .app uretmedi"; find build -maxdepth 4 -name '*.app*' -print; exit 1; }
          echo "uretilen: $APP"

      - name: 🧰 idb kur (erişilebilirlik tabanlı dokunma)
        run: |
          set -eo pipefail
          brew tap facebook/fb
          # Homebrew artik ucuncu taraf tap'lerini acikca guvenilir istiyor;
          # `brew trust` olmadan kurulum "untrusted tap" ile reddediliyor.
          brew trust facebook/fb 2>/dev/null || brew trust --formula facebook/fb/idb-companion 2>/dev/null || true
          brew install idb-companion
          pipx install fb-idb || python3 -m pip install --break-system-packages fb-idb
          idb --help >/dev/null 2>&1 && echo "idb hazır"

      - name: 🚀 Uygulamayı kur ve depolamayı tohumla
        id: kurulum
        run: |
          set -eo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ios/build -name '*.app' -maxdepth 5 -not -path '*.dSYM*' | head -1)
          [ -z "$APP" ] && { echo ".app bulunamadı"; exit 1; }
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle: $BUNDLE"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          # Veri kabi ancak uygulama bir kez calistiktan sonra olusur.
          # Kible ekrani konum izni istiyor; bastan vermek diyalogu tumuyle onler.
          xcrun simctl privacy "$UDID" grant location "$BUNDLE" || true
          xcrun simctl privacy "$UDID" grant location-always "$BUNDLE" || true
          xcrun simctl location "$UDID" set 41.0082,28.9784 || true
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 10
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          KAP=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
          node scripts/simulator-tohumla.js "$KAP" "$BUNDLE"
          # Tohumlama SESSIZCE etkisiz kalabilir (yanlis yol) — dosyayi dogrula.
          find "$KAP" -name manifest.json -print -exec sh -c 'echo "  anahtar sayisi: $(node -e "console.log(Object.keys(require(process.argv[1])).length)" "$1")"' _ {} \;
          xcrun simctl launch "$UDID" "$BUNDLE"

      - name: 📸 Kareleri çek
        if: ${{ inputs.tur != 'ozellik' }}
        run: |
          set -eo pipefail
          idb connect "${{ steps.sim.outputs.udid }}" || true
          mkdir -p kareler
          node scripts/simulator-ekranlari-cek.js kareler --udid "${{ steps.sim.outputs.udid }}" --bundle "${{ steps.kurulum.outputs.bundle }}"
          for f in kareler/*.png; do
            echo "$f -> $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | tr '\n' ' ')"
          done

      - name: 🎨 Mockup üret
        if: ${{ inputs.tur != 'ozellik' }}
        run: |
          # Magazaya giden kare ham ekran goruntusu DEGIL, basligi ve cihaz
          # cercevesi olan mockup'tir. Adimlar Chrome'u headless kullanir.
          node scripts/magaza-mockup.js kareler mockup --platform ios

      - name: ⬆️ Kareleri, mockup'ları ve erişilebilirlik ağaçlarını yükle
        if: ${{ always() && inputs.tur != 'ozellik' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-ekran-goruntuleri
          path: |
            kareler/
            mockup/
          retention-days: 14
          if-no-files-found: warn

      # --- OZELLIK TURU (magaza turuna dokunmaz; ayri klasor + ayri artifact) ---
      # Magaza adimi dustuyse de kossun (`!cancelled()`): iki tur bagimsiz.
      - name: 🧭 Özellik turu
        if: ${{ !cancelled() && inputs.tur != 'magaza' }}
        run: |
          set -eo pipefail
          idb connect "${{ steps.sim.outputs.udid }}" || true
          TEMALAR="acik"
          [ "${{ inputs.ozellik_koyu }}" = "true" ] && TEMALAR="acik koyu"
          for tema in $TEMALAR; do
            # Bir tema dusse de digeri cekilsin.
            node scripts/simulator-ozellik-cek.js "kareler-ozellik/iphone-$tema" \
              --udid "${{ steps.sim.outputs.udid }}" --bundle "${{ steps.kurulum.outputs.bundle }}" --tema "$tema" \
              || echo "UYARI: özellik turu ($tema) hatayla bitti"
          done

      - name: 🧾 Özellik kareleri özeti
        if: ${{ always() && inputs.tur != 'magaza' }}
        run: node scripts/ozellik-kare-ozeti.js kareler-ozellik ios | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ⬆️ Özellik karelerini yükle
        if: ${{ always() && inputs.tur != 'magaza' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-ozellik-kareleri
          # Kareler + her adimin erisilebilirlik agaci (agac/*.json): bir adim
          # tutmazsa ekranda hangi ogelerin oldugu oradan gorulur.
          path: kareler-ozellik/
          retention-days: 14
          if-no-files-found: warn

      # --- PAZARLAMA GORSELLERI (baslik + anlati + gercek ekran) ---
      # Magaza ve ozellik turunun kareleri BIRLIKTE okunur (tur=ikisi en dolu seti
      # verir); ham karesi olmayan gorsel atlanir ve ozette "eksik" yazar.
      - name: 🎨 Pazarlama görselleri
        if: ${{ !cancelled() }}
        run: |
          set -eo pipefail
          node scripts/magaza-gorselleri/uret.js --kaynak kareler --kaynak kareler-ozellik --cikis pazarlama --set iphone | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ⬆️ Pazarlama görsellerini yükle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-pazarlama
          path: pazarlama/
          retention-days: 14
          if-no-files-found: warn

      - name: 🏪 App Store Connect'e yükle
        if: ${{ inputs.asc_yukle && inputs.tur != 'ozellik' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        # --degistir: settekiler once silinir; yoksa yeni kareler arkaya eklenir.
        run: |
          # Pazarlama seti varsa o, yoksa magaza mockup'lari (ust duzeydeki .png'ler).
          KLASOR=mockup
          ls pazarlama/iphone/*.png >/dev/null 2>&1 && KLASOR=pazarlama/iphone
          node scripts/app-store-ekran-goruntuleri.js "$KLASOR" --degistir

  # --- APPLE WATCH TURU (issue #285) — iPhone isinden BAGIMSIZ, yalniz `tur: saat` ---
  # Yalniz saat hedefleri derlenir (`-target NamazSaat -sdk watchsimulator`): saat
  # hedefleri pod'a ve RN'e baglanmaz → pod install ve iPhone derlemesi (~25 dk) gerekmez.
  # Veri WatchConnectivity'den DEGIL, baslatma ortamindan gelir (yalniz simulator
  # derlemesinde okunur; gerekce `scripts/simulator-saat-cek.sh` basinda).
  saat-kareler:
    name: ⌚ Apple Watch kareleri
    if: ${{ inputs.tur == 'saat' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🍎 Araç sürümleri ve watchOS runtime
        run: |
          set -eo pipefail
          xcodebuild -version
          xcodebuild -showsdks | grep -i watch || true
          if ! xcrun simctl list runtimes | grep -q '^watchOS'; then
            echo "watchOS simülatör runtime'ı yok — indiriliyor"
            xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes | grep -iE 'ios|watchos'

      - name: 🏗️ Expo prebuild (iOS, saat hedefi AÇIK)
        run: npx expo prebuild --platform ios --no-install
        env:
          EXPO_NO_TELEMETRY: '1'
          # Bayrak yalniz bu imzasiz simulator derlemesi icin acilir (EAS'te tanimli degil).
          NAMAZ_IOS_SAAT: '1'

      - name: 🔨 Saat uygulamasını derle (watchOS simülatör, Release)
        id: saat_derleme
        working-directory: ios
        run: |
          set -eo pipefail
          PROJ=$(ls -d *.xcodeproj | head -1)
          # Yalniz saat hedefleri (`-target`): -sdk watchsimulator yalniz watchOS
          # hedeflerine uygulanir, iPhone hedefi derlenmez. Release: kullanicinin
          # gordugu derleme.
          xcodebuild \
            -project "$PROJ" \
            -target NamazSaat \
            -configuration Release \
            -sdk watchsimulator \
            SYMROOT="$PWD/build-saat" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          APP="$PWD/build-saat/Release-watchsimulator/NamazSaat.app"
          [ -d "$APP" ] || { echo "NamazSaat.app üretilmedi"; find build-saat -maxdepth 3 -name '*.app' -print; exit 1; }
          [ -d "$APP/PlugIns/NamazSaatWidget.appex" ] || { echo "Komplikasyon uzantısı gömülmedi"; ls "$APP"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "uretilen: $APP"

      - name: 📸 Kareleri çek
        env:
          SAAT_APP: ${{ steps.saat_derleme.outputs.app }}
        run: bash scripts/simulator-saat-cek.sh kareler-saat "$SAAT_APP"

      - name: ⬆️ Saat karelerini yükle
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-saat-kareleri
          path: kareler-saat/
          retention-days: 14
          if-no-files-found: warn

      # Apple Watch pazarlama seti yalniz ONIZLEME: saat hedefi app.json'da etkin:false
      # oldugu surece ASC'ye ham saat kareleri gider (setler.js > apple-watch).
      - name: 🎨 Apple Watch pazarlama görselleri
        if: ${{ !cancelled() }}
        run: node scripts/magaza-gorselleri/uret.js --kaynak kareler-saat --cikis pazarlama-saat --set apple-watch | tee -a "$GITHUB_STEP_SUMMARY"

      - name: ⬆️ Apple Watch pazarlama görsellerini yükle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-saat-pazarlama
          path: pazarlama-saat/
          retention-days: 14
          if-no-files-found: warn

  # --- APP STORE CONNECT ISLEMI — kare cekilmez, yalniz `tur: asc` ---
  asc:
    name: 🏪 App Store Connect (${{ inputs.asc_islem }})
    if: ${{ inputs.tur == 'asc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_ISSUER_ID: ${{ secrets.ASC_KEY_ISSUER_ID }}
      ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v7

      - name: ⚙️ Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 🖼️ Mağaza karelerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' }}
        uses: actions/download-artifact@v8
        with:
          name: ios-ekran-goruntuleri
          path: indirilen
          run-id: ${{ inputs.asc_kare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎨 Pazarlama görsellerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ios-pazarlama
          path: indirilen-pazarlama
          run-id: ${{ inputs.asc_kare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⌚ Apple Watch karelerini indir
        if: ${{ inputs.asc_islem == 'ekran-yukle' && inputs.asc_saat_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ios-saat-kareleri
          path: indirilen-saat
          run-id: ${{ inputs.asc_saat_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏪 İşlem
        env:
          ISLEM: ${{ inputs.asc_islem }}
          SURUM: ${{ inputs.asc_surum }}
        run: |
          set -eo pipefail
          if [ "$ISLEM" = "ekran-yukle" ]; then
            # --degistir: settekiler once silinir; yoksa yeni kareler arkaya eklenir.
            # Pazarlama seti (kosuda uretildiyse) once; yoksa magaza mockup'lari.
            KLASOR=indirilen/mockup
            ls indirilen-pazarlama/iphone/*.png >/dev/null 2>&1 && KLASOR=indirilen-pazarlama/iphone
            node scripts/app-store-ekran-goruntuleri.js "$KLASOR" --degistir
            # Apple Watch kareleri (Ultra 3 simülatörü 422x514 = APP_WATCH_ULTRA).
            if [ -d indirilen-saat ]; then
              node scripts/app-store-ekran-goruntuleri.js indirilen-saat --tip APP_WATCH_ULTRA --degistir
            fi
          elif [ -n "$SURUM" ]; then
            node scripts/app-store-surum.js "$ISLEM" --surum "$SURUM"
          else
            node scripts/app-store-surum.js "$ISLEM"
          fi
