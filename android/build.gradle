// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
    // KSP — Android AppFunctions derleyicisi için (issue #94, android/app/build.gradle).
    // Sürüm ÇALIŞAN Kotlin Gradle eklentisine KİLİTLİDİR. RN 0.88 kataloğu Kotlin 2.2.0 der ama
    // AGP 9.2.1'in POM'u kotlin-gradle-plugin 2.2.10'u çalışma bağımlılığı olarak getirir, çözüm
    // en yükseği seçer → KGP 2.2.10. Expo'nun eşlemesi (`KSPLookup`): 2.2.10 → 2.2.10-2.0.2.
    // AGP ya da Kotlin yükselirse bu satır da yükselmeli ("unsupported Kotlin version").
    classpath('com.google.devtools.ksp:symbol-processing-gradle-plugin:2.2.10-2.0.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
